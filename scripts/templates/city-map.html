<title>jay-wiki 지식 도시</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  /* 종이 한 판으로 간다. host 의 명·암 설정을 따라가지 않는다 -- 도면은 그 자체가 한 재료라서,
     재료를 host 가 정하면 그림이 흔들린다. 모든 색을 값으로 명시한다. */
  :root {
    color-scheme: light;
    --paper:  #f2ece0;
    --paper-2:#ebe4d4;
    --ink:    #1b1813;
    --ink-2:  #4c463a;
    --ink-3:  #7a7364;
    --rule:   #d3cab6;
    --grid:   #e5ddca;
    --line:   #6f6653;
    --fill:   rgb(255 253 247 / 0.86);
    --hover:  rgb(27 24 19 / 0.06);
    --callout:#f6e6bd;
    --callout-line:#c9a544;

    /* 노선 넷. 색만으로는 안 된다 -- 주황과 초록이 색각 이상에서 겹쳐서(ΔE 3.7),
       노선마다 선 모양을 따로 준다. 색은 거들 뿐이고 모양과 이름표가 본체다. */
    --req:  #2a6fd6;
    --del:  #d9662a;
    --evt:  #a03c8f;
    --obs:  #1f8a4c;
    /* 실패·복구는 노선이 아니라 «상태» 다. 늘 아이콘과 말이 함께 붙는다. */
    --fail: #c0392b;

    --f-disp: 'Gothic A1', 'Apple SD Gothic Neo', system-ui, sans-serif;
    --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif;
    --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: var(--f-body); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--req); outline-offset: 2px; }

  .app { display: grid; grid-template-columns: 356px minmax(0, 1fr); height: 100vh; }

  /* ---------- 왼쪽: 읽는 자리 ---------- */
  .side {
    background: var(--paper-2); border-right: 1.5px solid var(--rule);
    display: flex; flex-direction: column; min-height: 0; min-width: 0;
  }
  .side-head { padding: 17px 19px 13px; border-bottom: 1px solid var(--rule); }
  .eyebrow {
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px;
  }
  .side-head h1 { font-family: var(--f-disp); font-weight: 800; font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .side-head .tag { font-size: 12.5px; color: var(--ink-2); margin: 0 0 9px; }
  .side-head .facts {
    font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums; margin: 0; padding-top: 9px; border-top: 1px dashed var(--rule);
  }

  /* 읽는 법. 누르면 그 노선만 남는다. */
  .legend { padding: 12px 19px 13px; border-bottom: 1px solid var(--rule); }
  .legend h2 {
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--ink-3); margin: 0 0 8px; font-weight: 400;
  }
  .legend button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: 0; padding: 4px 6px; margin: 0 0 1px;
    border-radius: 3px; font: inherit; font-size: 12.5px; color: var(--ink-2);
    cursor: pointer; text-align: left;
  }
  .legend button:hover { background: var(--hover); color: var(--ink); }
  .legend button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 600; }
  .legend svg { flex: 0 0 auto; width: 42px; height: 10px; }
  .legend .n { margin-left: auto; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); }

  .side-body { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .zone-note {
    display: block; width: 100%; text-align: left; cursor: pointer;
    padding: 12px 19px 14px; margin: 0;
    background: none; border: 0; border-bottom: 1px solid var(--rule);
    font: inherit; color: inherit;
  }
  .zone-note:hover { background: var(--hover); }
  .zone-note .no {
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--ink-3);
    display: flex; align-items: baseline; gap: 8px;
  }
  .zone-note .no .go { margin-left: auto; letter-spacing: 0; }
  .zone-note h3 { font-family: var(--f-disp); font-weight: 700; font-size: 14.5px; margin: 3px 0 5px; }
  .zone-note p { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }
  .zone-note .tally { margin-top: 7px; font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); }

  /* ---------- 오른쪽: 보는 자리 ---------- */
  #stage {
    position: relative; overflow: hidden; cursor: grab; touch-action: none;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 26px 26px, 26px 26px;
  }
  #stage.dragging { cursor: grabbing; }
  #map { position: absolute; top: 0; left: 0; transform-origin: 0 0; overflow: visible; }

  /* 노선 강조. 하나를 고르면 나머지는 물러난다. */
  #map.picked .route { opacity: 0.10; }
  #map.picked .route.on { opacity: 1; }
  #map.picked .stop { opacity: 0.18; }
  #map.picked .stop.on { opacity: 1; }

  .node { cursor: pointer; }
  .node .box { fill: var(--fill); stroke: var(--line); stroke-width: 1.5; }
  .node:hover .box { stroke-width: 2.4; }
  .node.lit .box { fill: var(--callout); }

  .hud {
    position: absolute; z-index: 10;
    background: var(--paper-2); border: 1.5px solid var(--rule); border-radius: 3px;
    box-shadow: 0 6px 22px rgb(60 50 30 / 0.14);
  }
  .hud.zoom { left: 14px; bottom: 14px; padding: 5px; display: flex; align-items: center; gap: 4px; }
  .hud.zoom button {
    height: 29px; min-width: 29px; padding: 0 10px;
    background: none; border: 0; border-radius: 2px;
    color: var(--ink-2); font: inherit; font-size: 13px; cursor: pointer;
  }
  .hud.zoom button:hover { background: var(--hover); color: var(--ink); }
  .hud.zoom .z {
    font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3);
    min-width: 50px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .hud.zoom .sep { width: 1px; align-self: stretch; background: var(--rule); margin: 0 3px; }

  .hud.read { right: 14px; bottom: 14px; width: min(392px, calc(100% - 28px)); padding: 13px 15px 14px; }
  .hud.read[hidden] { display: none; }
  .hud.read .k {
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-3); display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;
  }
  .hud.read .k .n { margin-left: auto; letter-spacing: 0; text-transform: none; }
  .hud.read h4 { font-family: var(--f-disp); font-weight: 700; font-size: 16px; margin: 0 0 5px; }
  .hud.read > p { margin: 0 0 10px; font-size: 12.5px; color: var(--ink-2); }
  .hud.read ul { list-style: none; margin: 0; padding: 0; max-height: 168px; overflow-y: auto; }
  .hud.read li { border-top: 1px dashed var(--rule); }
  .hud.read li a {
    display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; align-items: baseline;
    padding: 5px 2px; font-size: 12.5px; color: var(--ink-2); text-decoration: none;
  }
  .hud.read li a:hover { color: var(--req); }
  .hud.read li .tick { font-family: var(--f-mono); font-size: 11px; }

  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 46vh) minmax(0, 54vh); }
    .side { border-right: 0; border-bottom: 1.5px solid var(--rule); order: 2; }
    #stage { order: 1; }
    .hud.read { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <aside class="side">
    <div class="side-head">
      <p class="eyebrow">portfolio.leneu.cloud</p>

    </div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;

const NS = 'http://www.w3.org/2000/svg';
const E = (t, a = {}, txt) => {
  const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]);
  if (txt !== undefined) e.textContent = txt;
  return e;
};

const byId = new Map(DATA.nodes.map((n) => [n.id, n]));
const nodesOf = (tab) => DATA.nodes.filter((n) => n.tab === tab);
const KTICK = { adr: '◆', postmortem: '▲', interview: '■', wiki: '·' };
const kindOf = (n) => (n.kind === 'interview' ? 'interview' : (KTICK[n.doc] ? n.doc : 'wiki'));

 * ------------------------------------------------------------------ */

const cx = (id) => { const n = nodeById.get(id); return n.x + n.w / 2; };

/* 노선. 색과 «선 모양» 을 함께 준다 -- 주황과 초록이 색각 이상에서 겹치므로 색만으로는 안 된다. */
const ROUTES = [
  { id: 'req', name: '요청', v: '--req', dash: '',        q: '사람이 누른 것이 어디까지 가나',
    pts: ['user', 'cf', 'trf', 'next', 'bff', 'pay', ['#', 1420, 331], ['#', 1420, 351], 'pg'] },
  { id: 'del', name: '배포', v: '--del', dash: '13 7',    q: '그 길을 바꾸는 유일한 방법',
    pts: ['gha', 'ghcr', 'runner', ['#', 2690, 503], ['#', 2760, 503], ['#', 2760, 700], ['#', 2320, 700], 'k3s'] },
  { id: 'evt', name: '이벤트', v: '--evt', dash: '2 7',   q: '한 번 일어난 일이 어떻게 퍼지나',

  { id: 'obs', name: '관측', v: '--obs', dash: '14 5 3 5', q: '무엇으로 증명하나',
    pts: [['#', 1000, 442], ['#', 1000, 900], ['#', 1375, 900], 'otel', 'prom', 'loki', 'tempo', 'graf'] },
];

/* 갈아타는 자리. 두 노선이 같은 칸을 쓰는 곳이라, 여기가 이 프로젝트의 «어려운 자리» 다. */
const INTERCHANGE = ['bff', 'kafka', 'k3s', 'pg', 'graf'];

/* 노선도 네 줄. 위 그림을 한 줄로 편 것이라, 순서만 남고 자리는 지운다. */
const STRIPS = [
  { id: 'req', label: 'REQUEST', stops: ['Cloudflare', 'Traefik', 'Next.js', 'BFF', 'API', 'DB'] },
  { id: 'del', label: 'DELIVERY', stops: ['commit', 'verify', 'build', 'GHCR', 'runner', 'k3s', 'smoke'] },
  { id: 'evt', label: 'EVENT', stops: ['Outbox', 'Kafka', 'consumer', 'DLQ'] },

/* 실제로 난 사고. 「무엇이 났나」가 아니라 「무엇으로 알았나」를 함께 적는다 --
   증거를 못 대면 그건 무용담이지 장애 대응이 아니다. */

  { n: '①', t: '없는 이미지', q: '왜 옛 Pod 는 살아 있었나?', tag: 'rollback',    ev: '로그' },
  { n: '②', t: 'Kafka 중복',  q: '같은 이벤트를 두 번 받으면?', tag: 'idempotency', ev: '메트릭' },
  { n: '③', t: '배송 timeout', q: '재시도는 어디까지?',        tag: 'retry · DLQ', ev: '트레이스' },

const routeEls = new Map();
function routePath(pts) {
  const P = pts.map((p) => (Array.isArray(p) ? [p[1], p[2]] : [cx(p), cy(p)]));
  // 모서리를 둥글게 깎는다. 노선도의 문법이고, 각지면 «선» 이 아니라 «표» 로 보인다.
  const R = 26;
  let d = `M ${P[0][0]} ${P[0][1]}`;
  for (let i = 1; i < P.length - 1; i += 1) {
    const [px, py] = P[i - 1], [x, y] = P[i], [nx, ny] = P[i + 1];
    const v1 = [x - px, y - py], v2 = [nx - x, ny - y];
    const l1 = Math.hypot(...v1) || 1, l2 = Math.hypot(...v2) || 1;
    const r = Math.min(R, l1 / 2, l2 / 2);
    d += ` L ${x - v1[0] / l1 * r} ${y - v1[1] / l1 * r}`;
    d += ` Q ${x} ${y} ${x + v2[0] / l2 * r} ${y + v2[1] / l2 * r}`;
  }
  d += ` L ${P[P.length - 1][0]} ${P[P.length - 1][1]}`;
  return d;
}
for (const r of ROUTES) {

    'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    ...(r.dash ? { 'stroke-dasharray': r.dash } : {}) }));

  routeEls.set(r.id, g);
}

  document.getElementById('rt').textContent = n.t;
  document.getElementById('rn').textContent = n.s ? `${n.s} — 이 구역을 적은 글입니다.` : '이 구역을 적은 글입니다.';
  const ul = document.getElementById('rl');
  ul.replaceChildren();
  for (const a of arts.slice(0, 40)) {
    const li = document.createElement('li');
    const link = document.createElement('a');
    link.href = a.href ?? '#';
    if (a.href) { link.target = '_blank'; link.rel = 'noopener'; }
    link.innerHTML = '<span class="tick"></span><span></span>';
    link.children[0].textContent = KTICK[kindOf(a)];
    link.children[1].textContent = a.title;
    li.append(link);
    ul.append(li);
  }
  read.hidden = false;
}
for (const [id, el] of nodeEls) {
  el.addEventListener('click', () => showNode(id));
  el.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); showNode(id); } });
}
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Escape') return;
  read.hidden = true;
  for (const el of nodeEls.values()) el.classList.remove('lit');
  if (picked) pickRoute(picked);
});

/* ---------- 확대와 이동 ---------- */
const stage = document.getElementById('stage');
const zlabel = document.getElementById('zlabel');
let k = 1, tx = 0, ty = 0;
function apply() {
  map.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
  stage.style.backgroundPosition = `${tx}px ${ty}px, ${tx}px ${ty}px`;
  stage.style.backgroundSize = `${26 * k}px ${26 * k}px, ${26 * k}px ${26 * k}px`;
  zlabel.textContent = `${Math.round(k * 100)}%`;
}
function zoomAt(f, px, py) {
  const next = Math.min(3, Math.max(0.12, k * f));
  if (Math.abs(next - k) < 0.0005) return;
  tx = px - (px - tx) * (next / k);
  ty = py - (py - ty) * (next / k);
  k = next;
  apply();
}
stage.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  const r = stage.getBoundingClientRect();
  zoomAt(ev.deltaY < 0 ? 1.08 : 1 / 1.08, ev.clientX - r.left, ev.clientY - r.top);
}, { passive: false });

let drag = null;
stage.addEventListener('pointerdown', (ev) => {
  if (ev.target.closest('.node')) return;
  drag = { x: ev.clientX, y: ev.clientY, tx, ty };
  stage.classList.add('dragging');
  stage.setPointerCapture(ev.pointerId);
});
stage.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  tx = drag.tx + (ev.clientX - drag.x);
  ty = drag.ty + (ev.clientY - drag.y);
  apply();
});
const stop = () => { drag = null; stage.classList.remove('dragging'); };
stage.addEventListener('pointerup', stop);
stage.addEventListener('pointercancel', stop);

function fit() {
  const pad = 34, bottom = 58;
  const w = stage.clientWidth, h = stage.clientHeight;
  k = Math.min(3, Math.max(0.12, Math.min((w - pad * 2) / W, (h - pad - bottom) / H)));
  tx = (w - W * k) / 2;
  ty = pad + (h - pad - bottom - H * k) / 2;
  apply();
}
/* 그 구역을 화면에 앉힌다. 세로는 가운데가 아니라 위쪽에 맞춘다 -- 긴 구역은
   가운데로 맞추면 머리가 잘려 어디를 보는지 모른다. */
function goZone(id) {
  const z = ZONES.find((x) => x.id === id);
  const w = stage.clientWidth, h = stage.clientHeight;
  k = Math.min(1.4, Math.max(0.2, Math.min((w - 90) / z.w, (h - 130) / z.h)));
  tx = (w - z.w * k) / 2 - z.x * k;
  ty = 46 - (z.y - 18) * k;
  apply();
}
document.getElementById('zin').addEventListener('click', () => zoomAt(1.32, stage.clientWidth / 2, stage.clientHeight / 2));
document.getElementById('zout').addEventListener('click', () => zoomAt(1 / 1.32, stage.clientWidth / 2, stage.clientHeight / 2));
document.getElementById('fit').addEventListener('click', fit);
addEventListener('resize', fit);

document.getElementById('facts').textContent =
  `위키 ${DATA.nodes.filter((n) => n.kind === 'wiki').length}편 · 면접 문서 ${DATA.nodes.filter((n) => n.kind === 'interview').length}편 · 글끼리 이어진 자리 ${DATA.edges.length}개`;

fit();
</script>
