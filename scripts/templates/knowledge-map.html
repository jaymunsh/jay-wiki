<title>jay-wiki 지식 지도</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground:      #f4f4f2;
    --surface:     #fcfcfb;
    --surface-2:   #ffffff;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-3:       #86857e;
    --line:        #dedcd6;
    --line-2:      #ebe9e4;
    --accent:      #2a78d6;

    --kind-adr:    #2a78d6;
    --kind-pm:     #eb6834;
    --kind-iv:     #1baf7a;
    --kind-plain:  #9a9990;

    --edge:        #c9c7bf;
    --edge-on:     #2a78d6;

    --font-display: 'Gothic A1', 'Apple SD Gothic Neo', system-ui, sans-serif;
    --font-body:    'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif;
    --font-mono:    'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    --rail: 310px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:     #131312;
      --surface:    #1a1a19;
      --surface-2:  #232322;
      --ink:        #ffffff;
      --ink-2:      #c3c2b7;
      --ink-3:      #8d8c83;
      --line:       #34342f;
      --line-2:     #2a2a26;
      --accent:     #3987e5;
      --kind-adr:   #3987e5;
      --kind-pm:    #d95926;
      --kind-iv:    #199e70;
      --kind-plain: #75746c;
      --edge:       #3a3a34;
      --edge-on:    #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:     #131312;
    --surface:    #1a1a19;
    --surface-2:  #232322;
    --ink:        #ffffff;
    --ink-2:      #c3c2b7;
    --ink-3:      #8d8c83;
    --line:       #34342f;
    --line-2:     #2a2a26;
    --accent:     #3987e5;
    --kind-adr:   #3987e5;
    --kind-pm:    #d95926;
    --kind-iv:    #199e70;
    --kind-plain: #75746c;
    --edge:       #3a3a34;
    --edge-on:    #3987e5;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .shell {
    display: grid;
    grid-template-columns: var(--rail) minmax(0, 1fr);
    gap: 0;
    height: 100vh;
  }

  /* ---------- 왼쪽 레일 ---------- */
  .rail {
    background: var(--surface);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }
  .rail-head { padding: 20px 20px 14px; border-bottom: 1px solid var(--line-2); }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 6px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 21px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    text-wrap: balance;
  }
  .tally {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    margin: 0;
  }

  .legend { padding: 14px 20px; border-bottom: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 7px; }
  .legend button {
    display: flex; align-items: center; gap: 9px;
    background: none; border: 0; padding: 2px 0; margin: 0;
    font: inherit; font-size: 12.5px; color: var(--ink-2);
    cursor: pointer; text-align: left; width: 100%;
  }
  .legend button:hover { color: var(--ink); }
  .legend button[aria-pressed="false"] { opacity: 0.4; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .legend .n { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .search { padding: 12px 20px; border-bottom: 1px solid var(--line-2); }
  .search input {
    width: 100%; padding: 8px 10px;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
    font: inherit; font-size: 13px;
  }
  .search input::placeholder { color: var(--ink-3); }

  .list { overflow-y: auto; flex: 1 1 auto; padding: 8px 0 24px; min-height: 0; }
  .grp { margin: 0 0 2px; }
  .grp-h {
    position: sticky; top: 0; z-index: 1;
    background: var(--surface);
    padding: 9px 20px 5px;
    font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-3);
    display: flex; gap: 8px; align-items: baseline;
    border-bottom: 1px solid var(--line-2);
  }
  .grp-h .n { margin-left: auto; font-variant-numeric: tabular-nums; }
  .row {
    display: flex; align-items: baseline; gap: 8px;
    width: 100%; padding: 5px 20px; margin: 0;
    background: none; border: 0; font: inherit; font-size: 12.5px;
    color: var(--ink-2); text-align: left; cursor: pointer;
    line-height: 1.45;
  }
  .row:hover { background: var(--line-2); color: var(--ink); }
  .row[aria-current="true"] { background: var(--line-2); color: var(--ink); font-weight: 600; }
  .row .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; transform: translateY(-1px); }

  /* ---------- 지도 ---------- */
  .stage { position: relative; min-width: 0; overflow: hidden; background: var(--ground); }
  svg.map { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  svg.map.dragging { cursor: grabbing; }

  .edge { fill: none; stroke: var(--edge); stroke-width: 1; opacity: 0.5; }
  .edge.on { stroke: var(--edge-on); stroke-width: 2; opacity: 1; }
  .edges.dim .edge:not(.on) { opacity: 0.12; }

  .spoke { stroke: var(--line); stroke-width: 1; }

  .node circle { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; }
  .node text {
    font-family: var(--font-body); font-size: 9px; fill: var(--ink-2);
    pointer-events: none; opacity: 0;
  }
  .zoomed .node text { opacity: 1; }
  .node.on circle { stroke: var(--ink); stroke-width: 2; }
  .node.on text { fill: var(--ink); font-weight: 600; opacity: 1; }
  .node.faded { opacity: 0.18; }

  .grp-label {
    font-family: var(--font-display); font-weight: 700; font-size: 15px;
    fill: var(--ink); pointer-events: none;
  }
  .grp-count {
    font-family: var(--font-mono); font-size: 10px; fill: var(--ink-3); pointer-events: none;
  }
  .hub-title { font-family: var(--font-display); font-weight: 800; font-size: 26px; fill: var(--ink); }
  .hub-sub { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-3); }

  /* ---------- 조작 ---------- */
  .tools {
    position: absolute; left: 16px; bottom: 16px;
    display: flex; gap: 6px; align-items: center;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px;
  }
  .tools button {
    width: 30px; height: 30px; padding: 0;
    background: none; border: 0; border-radius: 5px;
    color: var(--ink-2); font: inherit; font-size: 15px; cursor: pointer;
  }
  .tools button:hover { background: var(--line-2); color: var(--ink); }
  .tools .wide { width: auto; padding: 0 10px; font-size: 12px; }
  .tools .z { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); padding: 0 6px; font-variant-numeric: tabular-nums; }

  .hint {
    position: absolute; right: 16px; top: 16px;
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-3);
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px;
  }

  /* ---------- 고른 글 카드 ---------- */
  .card {
    position: absolute; right: 16px; bottom: 16px; width: min(360px, calc(100% - 32px));
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px 18px 15px;
    box-shadow: 0 8px 28px rgb(0 0 0 / 0.10);
  }
  .card .kind {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-2); margin-bottom: 7px;
  }
  .card h2 {
    font-family: var(--font-display); font-weight: 700; font-size: 16.5px;
    line-height: 1.35; margin: 0 0 7px; text-wrap: balance;
  }
  .card .slug { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin: 0 0 9px; word-break: break-all; }
  .card .note { font-size: 12.5px; color: var(--ink-2); margin: 0 0 12px; }
  .card .rel { border-top: 1px solid var(--line-2); padding-top: 10px; }
  .card .rel-h { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
  .card .rel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; max-height: 132px; overflow-y: auto; }
  .card .rel button {
    background: none; border: 0; padding: 1px 0; font: inherit; font-size: 12px;
    color: var(--ink-2); cursor: pointer; text-align: left; display: flex; gap: 7px; align-items: baseline;
  }
  .card .rel button:hover { color: var(--accent); }
  .card .rel .arrow { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); flex: 0 0 auto; }
  .card .go {
    display: inline-block; margin-top: 12px;
    font-size: 12.5px; color: var(--accent); text-decoration: none; font-weight: 500;
  }
  .card .go:hover { text-decoration: underline; }
  .card .close {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px; padding: 0;
    background: none; border: 0; border-radius: 5px;
    color: var(--ink-3); font-size: 16px; cursor: pointer;
  }
  .card .close:hover { background: var(--line-2); color: var(--ink); }

  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; grid-template-rows: minmax(0, 44vh) minmax(0, 56vh); height: 100vh; }
    .rail { border-right: 0; border-bottom: 1px solid var(--line); order: 2; }
    .stage { order: 1; }
    .card { width: calc(100% - 32px); }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<div class="shell">
  <aside class="rail">
    <div class="rail-head">
      <p class="eyebrow">portfolio.leneu.cloud</p>
      <h1>jay-wiki 지식 지도</h1>
      <p class="tally" id="tally"></p>
    </div>

    <div class="legend" id="legend" aria-label="글 갈래"></div>

    <div class="search">
      <input id="q" type="search" placeholder="제목 · slug · 태그로 찾기" aria-label="글 찾기" autocomplete="off">
    </div>

    <div class="list" id="list"></div>
  </aside>

  <div class="stage">
    <svg class="map" id="map" role="img" aria-label="위키 글과 면접 문서가 서로를 가리키는 관계 지도"></svg>

    <p class="hint">휠로 확대 · 끌어서 이동 · 점을 눌러 펼치기</p>

    <div class="tools">
      <button type="button" id="zin"  title="확대"    aria-label="확대">＋</button>
      <button type="button" id="zout" title="축소"    aria-label="축소">－</button>
      <span class="z" id="zlabel">100%</span>
      <button type="button" id="fit" class="wide">처음으로</button>
    </div>

    <div class="card" id="card" hidden>
      <button type="button" class="close" id="cclose" aria-label="닫기">×</button>
      <span class="kind" id="ckind"></span>
      <h2 id="ctitle"></h2>
      <p class="slug" id="cslug"></p>
      <p class="note" id="cnote"></p>
      <div class="rel" id="crel">
        <p class="rel-h">이어진 글</p>
        <ul id="crel-list"></ul>
      </div>
      <a class="go" id="cgo" href="#" target="_blank" rel="noopener">글 열기 ↗</a>
    </div>
  </div>
</div>

<script>
const DATA = /*__DATA__*/null;

/* ------------------------------------------------------------------ *
 * 갈래는 셋만 색으로 가른다. 탭 열하나를 색으로 나누면 색각 이상에서
 * 구별이 무너진다 -- 묶음은 색이 아니라 «방향» 으로 읽는다.
 * ------------------------------------------------------------------ */
const KIND = {
  adr:        { label: '설계 결정', varname: '--kind-adr' },
  postmortem: { label: '사고 기록', varname: '--kind-pm' },
  interview:  { label: '면접 문서', varname: '--kind-iv' },
  wiki:       { label: '일반 글',   varname: '--kind-plain' },
};
const kindOf = (n) => (n.kind === 'interview' ? 'interview' : (KIND[n.doc] ? n.doc : 'wiki'));
const colorOf = (n) => `var(${KIND[kindOf(n)].varname})`;

const NS = 'http://www.w3.org/2000/svg';
const el = (name, attrs = {}) => {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  return node;
};

/* ---------- 배치: 묶음마다 부채꼴 하나, 그 안에서 세 겹으로 ---------- */
const R0 = 300, BAND = 78, PAD = 0.055;
const byId = new Map(DATA.nodes.map((n) => [n.id, n]));
const groups = DATA.groups.map((g) => ({ ...g, nodes: DATA.nodes.filter((n) => n.tab === g.id) }))
  .filter((g) => g.nodes.length);

const total = groups.reduce((s, g) => s + g.nodes.length, 0);
let angle = -Math.PI / 2;
for (const g of groups) {
  const span = (g.nodes.length / total) * Math.PI * 2;
  g.a0 = angle + span * PAD;
  g.a1 = angle + span * (1 - PAD);
  g.mid = (g.a0 + g.a1) / 2;
  angle += span;

  g.nodes.forEach((n, i) => {
    const band = i % 3;
    const step = g.nodes.length > 1 ? (g.a1 - g.a0) / (g.nodes.length - 1) : 0;
    const a = g.nodes.length > 1 ? g.a0 + step * i : g.mid;
    const r = R0 + band * BAND;
    n.a = a; n.r = r;
    n.x = Math.cos(a) * r;
    n.y = Math.sin(a) * r;
  });
}

const degree = new Map();
for (const e of DATA.edges) {
  degree.set(e.from, (degree.get(e.from) ?? 0) + 1);
  degree.set(e.to, (degree.get(e.to) ?? 0) + 1);
}
const radiusOf = (n) => 3.2 + Math.min(4.6, (degree.get(n.id) ?? 0) * 0.62);

/* ---------- 그린다 ---------- */
const svg = document.getElementById('map');
const EXT = R0 + BAND * 2 + 150;
svg.setAttribute('viewBox', `${-EXT} ${-EXT} ${EXT * 2} ${EXT * 2}`);

const viewport = el('g');
svg.append(viewport);

const gSpokes = el('g', { class: 'spokes' });
const gEdges  = el('g', { class: 'edges' });
const gGroups = el('g', { class: 'grps' });
const gNodes  = el('g', { class: 'nodes' });
viewport.append(gSpokes, gEdges, gGroups, gNodes);

// 가운데 이름표. 지도가 무엇의 지도인지 축소해도 남는다.
const hub = el('g');
const t1 = el('text', { class: 'hub-title', 'text-anchor': 'middle', y: -4 });
t1.textContent = 'jay-wiki';
const t2 = el('text', { class: 'hub-sub', 'text-anchor': 'middle', y: 16 });
t2.textContent = `${DATA.nodes.length}편 · ${DATA.edges.length}개 연결`;
hub.append(t1, t2);
gGroups.append(hub);

for (const g of groups) {
  const rEnd = R0 + BAND * 2 + 22;
  gSpokes.append(el('line', {
    class: 'spoke',
    x1: Math.cos(g.a0 - 0.02) * 120, y1: Math.sin(g.a0 - 0.02) * 120,
    x2: Math.cos(g.a0 - 0.02) * rEnd, y2: Math.sin(g.a0 - 0.02) * rEnd,
  }));

  const lr = R0 + BAND * 2 + 46;
  const cx = Math.cos(g.mid), cy = Math.sin(g.mid);
  const anchor = cx > 0.25 ? 'start' : cx < -0.25 ? 'end' : 'middle';
  const lab = el('g', { transform: `translate(${(cx * lr).toFixed(1)} ${(cy * lr).toFixed(1)})` });
  const dy = cy < -0.6 ? -12 : cy > 0.6 ? 12 : 0;
  const lt = el('text', { class: 'grp-label', 'text-anchor': anchor, y: dy });
  lt.textContent = g.title;
  const lc = el('text', { class: 'grp-count', 'text-anchor': anchor, y: dy + 15 });
  lc.textContent = `${g.count}편`;
  lab.append(lt, lc);
  gGroups.append(lab);
}

// 선은 가운데로 당겨 묶는다. 안 당기면 원 안이 실뭉치가 된다.
const edgeEls = [];
for (const e of DATA.edges) {
  const a = byId.get(e.from), b = byId.get(e.to);
  if (!a || !b) continue;
  const path = el('path', {
    class: 'edge',
    d: `M ${a.x.toFixed(1)} ${a.y.toFixed(1)} Q ${((a.x + b.x) * 0.16).toFixed(1)} ${((a.y + b.y) * 0.16).toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`,
  });
  gEdges.append(path);
  edgeEls.push({ el: path, from: e.from, to: e.to });
}

const nodeEls = new Map();
for (const g of groups) {
  for (const n of g.nodes) {
    const deg = n.a * 180 / Math.PI;
    const flip = Math.cos(n.a) < 0;
    const grp = el('g', { class: 'node', transform: `translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`, tabindex: '0', role: 'button' });
    grp.append(el('circle', { r: radiusOf(n), fill: colorOf(n) }));
    const label = el('text', {
      transform: `rotate(${flip ? deg + 180 : deg})`,
      'text-anchor': flip ? 'end' : 'start',
      x: flip ? -(radiusOf(n) + 4) : radiusOf(n) + 4,
      y: 3,
    });
    label.textContent = n.title.length > 26 ? `${n.title.slice(0, 25)}…` : n.title;
    grp.append(label);
    const aria = `${n.title} — ${KIND[kindOf(n)].label}`;
    grp.setAttribute('aria-label', aria);
    grp.addEventListener('click', () => select(n.id));
    grp.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(n.id); } });
    gNodes.append(grp);
    nodeEls.set(n.id, grp);
  }
}

/* ---------- 확대·이동 ---------- */
let k = 1, tx = 0, ty = 0;
const zlabel = document.getElementById('zlabel');
function apply() {
  viewport.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`);
  zlabel.textContent = `${Math.round(k * 100)}%`;
  svg.classList.toggle('zoomed', k >= 1.55);
}
function zoomBy(factor, cx, cy) {
  const next = Math.min(6, Math.max(0.45, k * factor));
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const px = (cx - rect.left) / rect.width * vb.width + vb.x;
  const py = (cy - rect.top) / rect.height * vb.height + vb.y;
  tx = px - (px - tx) * (next / k);
  ty = py - (py - ty) * (next / k);
  k = next;
  apply();
}
svg.addEventListener('wheel', (ev) => {
  ev.preventDefault();
  zoomBy(ev.deltaY < 0 ? 1.14 : 1 / 1.14, ev.clientX, ev.clientY);
}, { passive: false });

let drag = null;
svg.addEventListener('pointerdown', (ev) => {
  if (ev.target.closest('.node')) return;
  drag = { x: ev.clientX, y: ev.clientY, tx, ty };
  svg.classList.add('dragging');
  svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener('pointermove', (ev) => {
  if (!drag) return;
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  tx = drag.tx + (ev.clientX - drag.x) / rect.width * vb.width;
  ty = drag.ty + (ev.clientY - drag.y) / rect.height * vb.height;
  apply();
});
const endDrag = () => { drag = null; svg.classList.remove('dragging'); };
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);

document.getElementById('zin').addEventListener('click', () => {
  const r = svg.getBoundingClientRect();
  zoomBy(1.3, r.left + r.width / 2, r.top + r.height / 2);
});
document.getElementById('zout').addEventListener('click', () => {
  const r = svg.getBoundingClientRect();
  zoomBy(1 / 1.3, r.left + r.width / 2, r.top + r.height / 2);
});
document.getElementById('fit').addEventListener('click', () => { k = 1; tx = 0; ty = 0; apply(); });

/* ---------- 고르기 ---------- */
const card = document.getElementById('card');
let selected = null;

function select(id, recenter = false) {
  selected = id;
  const n = byId.get(id);
  if (!n) return;

  const linked = new Set();
  for (const e of edgeEls) {
    const on = e.from === id || e.to === id;
    e.el.classList.toggle('on', on);
    if (on) { linked.add(e.from); linked.add(e.to); }
  }
  gEdges.classList.add('dim');

  for (const [nid, node] of nodeEls) {
    node.classList.toggle('on', nid === id);
    node.classList.toggle('faded', !linked.has(nid) && nid !== id);
  }

  document.getElementById('ckind').innerHTML =
    `<span class="swatch" style="background:${colorOf(n)}"></span>${KIND[kindOf(n)].label}`;
  document.getElementById('ctitle').textContent = n.title;
  document.getElementById('cslug').textContent = n.kind === 'interview' ? n.file : n.id;
  document.getElementById('cnote').textContent = n.note || '';

  const rel = [];
  for (const e of DATA.edges) {
    if (e.from === id && byId.has(e.to)) rel.push({ id: e.to, dir: '→' });
    else if (e.to === id && byId.has(e.from)) rel.push({ id: e.from, dir: '←' });
  }
  const relList = document.getElementById('crel-list');
  relList.replaceChildren();
  document.getElementById('crel').hidden = rel.length === 0;
  for (const r of rel) {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<span class="arrow">${r.dir}</span><span></span>`;
    b.lastElementChild.textContent = byId.get(r.id).title;
    b.addEventListener('click', () => select(r.id, true));
    li.append(b);
    relList.append(li);
  }

  const go = document.getElementById('cgo');
  if (n.href) { go.hidden = false; go.href = n.href; go.textContent = '위키에서 열기 ↗'; }
  else { go.hidden = true; }

  card.hidden = false;

  for (const row of document.querySelectorAll('.row')) {
    row.setAttribute('aria-current', row.dataset.id === id ? 'true' : 'false');
  }
  const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });

  if (recenter) {
    k = Math.max(k, 1.8);
    tx = -n.x * k; ty = -n.y * k;
    apply();
  }
}

function clearSelect() {
  selected = null;
  card.hidden = true;
  gEdges.classList.remove('dim');
  for (const e of edgeEls) e.el.classList.remove('on');
  for (const node of nodeEls.values()) node.classList.remove('on', 'faded');
  for (const row of document.querySelectorAll('.row')) row.setAttribute('aria-current', 'false');
}
document.getElementById('cclose').addEventListener('click', clearSelect);
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') clearSelect(); });

/* ---------- 레일 ---------- */
document.getElementById('tally').textContent =
  `${DATA.nodes.length}편 · ${DATA.groups.length}묶음 · 서로를 가리키는 선 ${DATA.edges.length}개`;

const legend = document.getElementById('legend');
const hidden = new Set();
for (const [key, meta] of Object.entries(KIND)) {
  const count = DATA.nodes.filter((n) => kindOf(n) === key).length;
  if (!count) continue;
  const b = document.createElement('button');
  b.type = 'button';
  b.setAttribute('aria-pressed', 'true');
  b.innerHTML = `<span class="swatch" style="background:var(${meta.varname})"></span><span></span><span class="n"></span>`;
  b.children[1].textContent = meta.label;
  b.children[2].textContent = `${count}`;
  b.addEventListener('click', () => {
    if (hidden.has(key)) hidden.delete(key); else hidden.add(key);
    b.setAttribute('aria-pressed', hidden.has(key) ? 'false' : 'true');
    for (const [nid, node] of nodeEls) {
      node.style.display = hidden.has(kindOf(byId.get(nid))) ? 'none' : '';
    }
    renderList(document.getElementById('q').value);
  });
  legend.append(b);
}

const list = document.getElementById('list');
function renderList(query = '') {
  const q = query.trim().toLowerCase();
  list.replaceChildren();
  for (const g of groups) {
    const items = g.nodes.filter((n) => {
      if (hidden.has(kindOf(n))) return false;
      if (!q) return true;
      return (`${n.title} ${n.id} ${(n.tags || []).join(' ')}`).toLowerCase().includes(q);
    });
    if (!items.length) continue;
    const box = document.createElement('div');
    box.className = 'grp';
    const h = document.createElement('div');
    h.className = 'grp-h';
    h.innerHTML = '<span></span><span class="n"></span>';
    h.children[0].textContent = g.title;
    h.children[1].textContent = `${items.length}`;
    box.append(h);
    for (const n of items) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'row';
      b.dataset.id = n.id;
      b.setAttribute('aria-current', n.id === selected ? 'true' : 'false');
      b.innerHTML = `<span class="dot" style="background:${colorOf(n)}"></span><span></span>`;
      b.lastElementChild.textContent = n.title;
      b.addEventListener('click', () => select(n.id, true));
      box.append(b);
    }
    list.append(box);
  }
}
document.getElementById('q').addEventListener('input', (ev) => renderList(ev.target.value));

/* ---------- 처음 화면 ---------- */
apply();
renderList();
// 가장 많이 참조되는 «위키 글» 을 먼저 펼쳐 둔다. 빈 껍데기로 열리면 무엇을 하는 화면인지
// 안 보이고, 면접 문서로 열면 그 한 편이 위키 수십 편을 가리켜 선이 지도를 덮는다.
const busiest = DATA.nodes
  .filter((n) => n.kind === 'wiki')
  .sort((a, b) => (degree.get(b.id) ?? 0) - (degree.get(a.id) ?? 0))[0];
if (busiest) select(busiest.id);
</script>
