server:
  retention: 7d
  extraArgs:
    web.enable-remote-write-receiver: null
  persistentVolume:
    size: 8Gi
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

alertmanager:
  enabled: true
  persistentVolume:
    size: 2Gi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 64Mi

prometheus-pushgateway:
  enabled: false

extraScrapeConfigs: |
  # 파드 단위로 긁는다. Service DNS 를 찍으면 스크레이프가 파드 하나에 붙어버려서
  # 나머지 파드의 카운터가 통째로 안 보이고, up 도 파드 둘을 시계열 하나로 덮어
  # JaywikiBackendDown 이 한 파드의 죽음을 못 잡는다. 백엔드가 상시 2 가 된 뒤로 문제가 됐다.
  - job_name: jaywiki-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names:
            - backend
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: jaywiki;http
      - target_label: namespace
        replacement: backend
      - target_label: service
        replacement: jaywiki
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
  - job_name: jaywiki-shipping-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - jaywiki-shipping-api.backend.svc.cluster.local:8000
        labels:
          namespace: backend
          service: jaywiki-shipping-api
  - job_name: jaywiki-payment-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets:
          - jaywiki-payment-api.backend.svc.cluster.local:8000
        labels:
          namespace: backend
          service: jaywiki-payment-api

serverFiles:
  alerting_rules.yml:
    groups:
      - name: jaywiki.rules
        rules:
          # 「백엔드가 죽었다」와 「지표를 못 긁는다」는 다른 사고다. 한동안 up == 0 하나로
          # 둘 다 보려다 어느 쪽도 제대로 못 봤다 — 대상이 파드마다 하나가 된 뒤로 롤아웃에서
          # 내려가는 파드마다 pending 이 떴고(2026-08-19 배포에서 세 번), 그걸 피하려고 for 를
          # 5m 으로 밀자 이번엔 탐지가 5분 늦어졌다. 신호를 갈라 각자 맞는 창을 준다.
          #
          # 가용 레플리카는 up 보다 훨씬 덜 흔들리지만 안 흔들리는 것은 아니다.
          # 바꾸기 전에 171표본을 보고 「2 밑으로 안 간다」고 단정했는데, 그 창에 파드가 실제로
          # 갈리는 순간이 안 들어 있었다. 바로 다음 롤아웃에서 1 로 두 표본(60초) 떨어졌다.
          # for 를 1m 으로 두면 그 60초가 발사 직전이라 롤아웃이 조금만 느려도 오탐이 된다.
          # 잰 값 위로 여유를 둬 2m 으로 한다 — 전의 5m 보다는 3분 빠르다.
          # 2 는 HPA minReplicas 와 같은 값이다 — 그 값을 바꾸면 여기도 같이 바꾼다.
          - alert: JaywikiBackendDown
            expr: kube_deployment_status_replicas_available{namespace="backend", deployment="jaywiki"} < 2
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "jaywiki 백엔드 파드가 모자란다"
              description: "가용 레플리카가 2 밑으로 떨어졌습니다. kubectl -n backend get pod -l app=jaywiki 로 어느 파드가 안 떴는지 봅니다."

          # 이쪽은 「파드는 떠 있는데 Prometheus 가 못 긁는다」다. 긁기가 죽으면 5xx·지연
          # 알림이 통째로 눈을 감으므로, 조용해지는 것 자체를 알아야 한다. 롤아웃 중에는
          # 대상이 사라졌다 생기므로 창을 길게 준다.
          - alert: JaywikiBackendScrapeDown
            expr: up{job="jaywiki-backend"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "jaywiki 백엔드 지표를 못 긁는다"
              description: "Prometheus 가 /actuator/prometheus 를 5분간 못 읽었습니다. 이 상태에서는 5xx·지연 알림이 함께 눈을 감습니다."

          - alert: JaywikiApiP95High
            expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="jaywiki-backend"}[5m])) by (le)) > 0.5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "jaywiki API p95 latency is high"
              description: "p95 latency has been above 500ms for more than 2 minutes."

          - alert: JaywikiApi5xxHigh
            expr: |
              (
                sum(rate(http_server_requests_seconds_count{job="jaywiki-backend", status=~"5.."}[5m]))
                /
                clamp_min(sum(rate(http_server_requests_seconds_count{job="jaywiki-backend"}[5m])), 0.001)
              ) > 0.01
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "jaywiki API 5xx ratio is high"
              description: "5xx responses are above 1% over the last 5 minutes."

          # 위 규칙은 비율이라 500 한 건은 문턱을 못 넘는다. 트래픽이 적은 사이트에서는
          # 관리자가 저장 한 번 못 한 사고가 그대로 묻힌다. 건수로 한 번 더 본다.
          # uri 를 함께 보내 어느 API 인지 알림에서 바로 읽히게 한다.
          #
          # increase() 를 쓰지 않는다. 그 API 에서 처음 나는 5xx 는 시계열이 값 1로 태어나
          # 창 안의 첫 샘플과 마지막 샘플이 같고, increase 가 0이 된다(실측 확인).
          # pod 가 재시작하면 시계열도 새로 나므로 배포마다 그 구멍이 생긴다.
          # 지금 값에서 10분 전 값을 빼되, 그때 없던 시계열은 0을 기준으로 둔다.
          - alert: JaywikiApi5xxObserved
            expr: |
              (
                sum by (method, uri, status, service, namespace) (http_server_requests_seconds_count{job="jaywiki-backend", status=~"5.."})
                -
                (
                  sum by (method, uri, status, service, namespace) (http_server_requests_seconds_count{job="jaywiki-backend", status=~"5.."} offset 10m)
                  or
                  sum by (method, uri, status, service, namespace) (http_server_requests_seconds_count{job="jaywiki-backend", status=~"5.."} * 0)
                )
              ) > 0
            for: 0m
            labels:
              severity: warning
            # 문구는 알림을 받은 사람이 다음에 무엇을 할지 알게 쓴다.
            # 10분은 규칙이 되돌아보는 창이지 지연이 아니다. 실제 도달은 30~50초다.
            # 그래서 문구에 창 길이를 적지 않는다. 늦게 오는 것처럼 읽힌다.
            # 예외 본문은 지표에 없어서 여기서 못 싣는다. 로그 원문이 필요하면 Loki ruler 다.
            annotations:
              summary: "{{ $labels.status }} 오류 · {{ $labels.method }} {{ $labels.uri }}"
              description: "Grafana - Explore - Loki 에서 {namespace=\"backend\"} |= \"unhandled exception\" 으로 원인 줄을 봅니다."

          # 400 은 보낸 쪽 잘못이라 5xx 가 아니다. 그런데 '보낸 쪽'이 우리 화면일 때가 있다.
          # 실제로 관리자 화면이 발행일을 잘못된 형식으로 보내 저장이 막힌 적이 있는데,
          # 그때는 서버가 500 을 내줘서 5xx 규칙에 걸렸다. 400 으로 바로잡고 나면 그 종류의
          # 사고가 알림 밖으로 나간다. 그래서 400 만 따로 본다.
          #
          # 401·403·404 는 뺀다. 남이 문을 두드리는 것이고 우리가 할 일이 없다.
          # 라우트가 안 맞은 요청(uri 가 /** 나 NOT_FOUND)도 뺀다. 봇 스캔이 대부분이다.
          # 식의 모양은 5xx 규칙과 같다 — increase 는 처음 태어난 시계열을 0으로 센다.
          - alert: JaywikiApi400Observed
            expr: |
              (
                sum by (method, uri, status, service, namespace) (http_server_requests_seconds_count{job="jaywiki-backend", status="400", uri!~"/\\*\\*|NOT_FOUND|UNKNOWN|REDIRECTION"})
                -
                (
                  sum by (method, uri, status, service, namespace) (http_server_requests_seconds_count{job="jaywiki-backend", status="400", uri!~"/\\*\\*|NOT_FOUND|UNKNOWN|REDIRECTION"} offset 10m)
                  or
                  sum by (method, uri, status, service, namespace) (http_server_requests_seconds_count{job="jaywiki-backend", status="400", uri!~"/\\*\\*|NOT_FOUND|UNKNOWN|REDIRECTION"} * 0)
                )
              ) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.status }} 잘못된 요청 · {{ $labels.method }} {{ $labels.uri }}"
              description: "서버가 요청을 거절했습니다. 우리 화면이 보낸 것이면 화면 쪽 버그입니다. Grafana - Explore - Loki 에서 unreadable request body 로 확인합니다."

          # 403 은 원래 뺐다 — 남이 문을 두드리는 것이라 우리가 할 일이 없어서다.
          # 관리자 경로만 예외로 둔다. GET /api/admin/** 를 ADMIN 으로 닫은 뒤부터,
          # 이 경로의 403 은 남이 아니라 우리 화면이나 서버 코드가 받는 것일 수 있다.
          # 실제로 서버가 쿠키를 안 실어 403 을 받았고, 호출부가 그것을 삼켜 화면만 비었다.
          # 400 규칙과 같은 이유다 — 거절당한 '보낸 쪽'이 우리일 때가 있다.
          #
          # 단발은 무시해야 한다. rate > 0 에 for 를 걸면 창이 미끄러지는 동안 참이 유지돼
          # 한 건으로도 발사된다. 그래서 건수로 센다 — 5분 창에 10건 이상이 5분간 이어질 때만.
          # 로그인하지 않은 사람은 미들웨어가 /login 으로 보내므로 이 경로의 403 은 평소 0 에 가깝다.
          - alert: JaywikiAdminForbiddenSustained
            expr: |
              sum by (method, uri, status, service, namespace) (
                increase(http_server_requests_seconds_count{job="jaywiki-backend", status="403", uri=~"/api/admin.*"}[5m])
              ) >= 10
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "관리자 경로 403 이 이어짐 · {{ $labels.method }} {{ $labels.uri }}"
              description: "관리자 화면이나 서버 호출이 인증 없이 이 경로를 부르고 있을 수 있습니다. 로그인 상태로 같은 화면을 열어 재현되는지 먼저 봅니다."

          # obs 를 넣는다. tempo 가 2042회 재시작하는 동안 이 규칙이 한 번도 안 울었다 —
          # 관측 스택이 관측 밖에 있었다. 지켜보는 것이 죽는 것도 사고다.
          - alert: JaywikiPodRestartHigh
            expr: increase(kube_pod_container_status_restarts_total{namespace=~"backend|frontend|obs"}[15m]) > 3
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "jaywiki pod restart count is high"
              description: "A backend or frontend container restarted more than 3 times in 15 minutes."

          # 2026-08-19 리허설에서 이 규칙이 안 풀린다는 것이 드러났다. 카운터는 줄지 않으므로
          # sum(...) > 0 은 파드가 재시작할 때까지 계속 참이고, repeat_interval 3시간마다 같은
          # 통이 온다. description 은 원래부터 "지난 10분"이라고 말하고 있었다 — 식을 문구에 맞춘다.
          #
          # 그날 저녁 그 increase 판도 안 운다는 것이 실측으로 드러났다. DLQ 시계열은 첫 DLQ 와
          # 함께 값 1로 태어나므로 창 안의 첫 표본과 마지막 표본이 같고 increase 가 0이 된다.
          # 파드는 배포마다 새로 뜨니 「첫 DLQ」는 배포마다 다시 온다. 위 5xx 규칙과 같은 모양으로 센다.
          - alert: JaywikiKafkaDlqObserved
            expr: |
              (
                sum by (consumer, service, namespace) (jaywiki_kafka_consumer_events_total{status="DLQ"})
                -
                (
                  sum by (consumer, service, namespace) (jaywiki_kafka_consumer_events_total{status="DLQ"} offset 10m)
                  or
                  sum by (consumer, service, namespace) (jaywiki_kafka_consumer_events_total{status="DLQ"} * 0)
                )
              ) > 0
            for: 0m
            labels:
              severity: info
            annotations:
              summary: "jaywiki Kafka demo sent an event to DLQ"
              description: "The Kafka order demo produced at least one DLQ event in the last 10 minutes."

          # 보상 중의 결제 취소 실패는 돈이 잡힌 채 남는 유일한 자리다.
          # 사가는 재고를 풀고 정상 종료하므로 화면에도, 사가 상태에도 흔적이 없다.
          # 코드에는 warn 로그 한 줄뿐이라(OrderSagaService.cancelPaymentQuietly)
          # 이 알림이 없으면 아무도 모른다.
          #
          # 두 참여자가 동시에 안 될 때만 나므로 평시에는 0이다. 한 건이라도 알린다.
          # DLQ 규칙과 같은 이유로 increase 를 못 쓴다. 이 카운터는 첫 실패와 함께 태어난다.
          - alert: JaywikiPaymentCancelFailed
            expr: |
              (
                sum by (service, namespace) (jaywiki_payment_client_requests_total{operation="cancel", result="error"})
                -
                (
                  sum by (service, namespace) (jaywiki_payment_client_requests_total{operation="cancel", result="error"} offset 10m)
                  or
                  sum by (service, namespace) (jaywiki_payment_client_requests_total{operation="cancel", result="error"} * 0)
                )
              ) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "jaywiki payment cancellation failed — a payment may be left uncancelled"
              description: "보상 중 결제 취소가 실패했다. 결제가 잡힌 채 남았을 수 있다. payment-api 의 tb_payment 에서 해당 주문의 상태를 직접 확인한다."

          # 모놀리스가 원격 호출 도중 사라지면 사가가 STARTED 로 남는다. 재고는 잡힌 채고,
          # 아무도 그 사가를 이어받지 않는다. 자동 복구는 아직 없으므로 사람이 받아야 한다.
          #
          # 정상 사가는 수십 ms 다. 게이지가 이미 10분 창을 적용해서 세므로 0보다 크면 바로 알린다.
          - alert: JaywikiSagaOrphaned
            expr: max(jaywiki_saga_orphaned) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "jaywiki saga stuck in STARTED — nobody picked it up"
              description: "STARTED 인 채 10분이 지난 사가가 있다. 프로세스가 호출 도중 죽은 자리다. tb_saga_instance 에서 해당 사가를 찾아 참여자 상태를 확인하고 손으로 정리한다."

          # 재부팅은 두 달에 한 번쯤 커널 패치가 요구할 때만 돈다(04:00). 그 사실이
          # 두 달간 아무에게도 안 알려졌고, 설정한 본인도 도는 줄 몰랐다.
          # 노드가 안 떴다면 아침까지 사이트가 죽어 있었을 것이다.
          #
          # for 를 안 건다. 부팅 직후 5분 창이라 조건 자체가 이미 시간을 담고 있고,
          # for 를 얹으면 그만큼 늦게 firing 해 창을 벗어난다.
          - alert: NodeRebooted
            expr: (time() - node_boot_time_seconds) < 300
            labels:
              severity: warning
            annotations:
              summary: "노드가 방금 재부팅됐다"
              description: "miniPC 가 5분 안에 부팅했다. 커널 패치에 따른 04:00 자동 재부팅이면 정상이다. 그 시각이 아니라면 예기치 않은 재부팅이므로 dmesg 와 last -x reboot 을 본다. 공개 화면 복귀는 실측 기준 60초, 전체 복구는 91초다."

          # 고정 주기 재부팅은 넣지 않기로 했다(위키 reboot-cadence-and-storage-growth-boundary).
          # 다만 그 판단의 근거였던 메모리 관측이 Prometheus 보존 7일까지만 유효해서,
          # 한 달짜리 완만한 누수는 배제하지 못한다고 그 글이 스스로 적어 두었다.
          # 강제로 돌리는 대신 길어지면 알리고 판단은 사람이 한다.
          #
          # 30일은 커널 패치 주기(평균 12일)의 두 배가 넘는 값이다. 패치가 정상적으로
          # 도는 동안에는 울리지 않고, 패치 경로가 멈췄을 때만 울린다.
          - alert: NodeUptimeLong
            expr: (time() - node_boot_time_seconds) > 2592000
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "노드가 30일 넘게 재부팅되지 않았다"
              description: "커널 패치 주기가 평균 12일인데 30일을 넘겼다. 패치가 안 깔리고 있거나(unattended-upgrades 로그 확인), 재부팅 예약이 안 잡히고 있다(/etc/apt/apt.conf.d/52auto-reboot 확인). 메모리 추세도 함께 본다."

          - alert: NodeMemoryHigh
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "node memory usage is high"
              description: "Node memory usage has been above 80% for more than 5 minutes."

          - alert: DiskAlmostFull
            expr: |
              (
                1 - (
                  node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
                  /
                  node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
                )
              ) > 0.85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "node disk usage is high"
              description: "A filesystem has been above 85% usage for more than 10 minutes."

          # 백업은 조용한 실패가 제일 위험하다. 필요할 때 열어 보기 전까지 아무도 모른다.
          # 두 가지를 갈라서 본다 — 돌았는데 실패한 것과, 아예 안 돈 것.
          #
          # 실패한 Job 객체는 failedJobsHistoryLimit(3) 만큼 남아 있어서 조건만 보면
          # 며칠씩 firing 이 유지된다. 시작한 지 1시간 안쪽인 것만 본다 — 방금 난 실패만
          # 알리고, 그 뒤에는 조용해진다. send_resolved 가 false 라 해제 통은 안 온다.
          - alert: JaywikiBackupJobFailed
            expr: |
              (
                kube_job_failed{namespace="data", condition="true"} > 0
              )
              and on (job_name, namespace)
              (time() - kube_job_status_start_time{namespace="data"} < 3600)
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "백업 Job 이 실패했다 · {{ $labels.job_name }}"
              description: "kubectl -n data logs job/{{ $labels.job_name }} 로 원인을 봅니다. 다음 예정 시각은 매일 03:17 입니다."

          # CronJob 이 통째로 멈춘 경우 — 위 규칙은 Job 이 만들어져야 걸리므로 못 잡는다.
          # 하루 한 번(03:17)이라 25시간을 넘기면 한 번을 건너뛴 것이다.
          - alert: JaywikiBackupNotRunning
            expr: |
              time() - kube_cronjob_status_last_schedule_time{namespace="data", cronjob="jaywiki-postgres-backup"} > 90000
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "백업이 25시간 넘게 돌지 않았다"
              description: "CronJob data/jaywiki-postgres-backup 이 예정 시각(매일 03:17)에 Job 을 만들지 않았습니다. kubectl -n data get cronjob 으로 suspend 여부를 먼저 봅니다."

          # 알림 체계가 죽었다는 것을 그 죽은 알림 체계로 알릴 수는 없다. 그래서 조건이
          # 없는 규칙을 하나 두고, 이것이 밖으로 나가는 것을 외부(healthchecks.io)가 센다.
          # 신호가 끊기면 외부가 자기 채널로 알린다 — dead man's switch 다.
          #
          # 실제로 Alertmanager receiver 가 default-receiver 로 되돌아가 35일 동안
          # 전달만 조용히 죽어 있던 적이 있다. 규칙도 화면도 전부 정상으로 보였다.
          # severity 를 warning 으로 주지 않는다. 텔레그램 라우트로 새면 3시간마다 통이 온다.
          - alert: Watchdog
            expr: vector(1)
            for: 0m
            labels:
              severity: none
            annotations:
              summary: "alerting pipeline is alive"
              description: "This alert always fires. Its absence at healthchecks.io means the alerting path is broken."
