tempo:
  reportingEnabled: false
  memBallastSizeMbs: 0
  retention: 24h
  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://prom-prometheus-server.obs.svc.cluster.local/api/v1/write
    processor:
      service_graphs:
        wait: 10s
        max_items: 10000
      span_metrics:
        enable_target_info: true
    registry:
      collection_interval: 15s
    storage:
      path: /var/tempo/metrics
      remote_write: []
    traces_storage:
      path: /var/tempo/generator-wal
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
    per_tenant_override_config: /conf/overrides.yaml
  # liveness 를 /ready 에 걸면 안 된다. /ready 는 「지금 요청을 받을 수 있나」이고,
  # 링이나 제너레이터가 잠깐 안 붙어도 not-ready 가 된다. 그것으로 파드를 죽이면
  # 재시작 -> WAL 재생 -> 느려짐 -> 프로브 실패의 고리가 생긴다.
  # 실제로 2042회 재시작했고 자원은 남아돌았다(메모리 170Mi/512Mi, CPU 11m/500m).
  # liveness 는 프로세스가 살아 있는지만 본다 — /status/version 은 정적 응답이다.
  livenessProbe:
    httpGet:
      path: /status/version
      port: 3200
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  # 평시는 168Mi 인데 배포 롤아웃 순간 512Mi 한도까지 튄다(2026-08-20 실측). 완만한 증가가
  # 아니라 버스트다 — 파드가 갈리는 동안 스팬이 몰리고 span-metrics 생성기가 같이 부푼다.
  # 512Mi 로는 그 순간을 못 넘겨 OOMKilled 가 났다. 노드는 15GiB 에 47% 라 여유가 있다.
  # ponytail: 1Gi 는 버스트 여유지 측정한 상한이 아니다. 또 OOM 이 나면 한도를 더 올리기 전에
  # metricsGenerator 의 processors 를 줄이거나 retention 24h 를 손대는 쪽을 먼저 본다.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

persistence:
  enabled: true
  size: 4Gi
