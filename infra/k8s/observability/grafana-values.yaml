admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

testFramework:
  enabled: false

initChownData:
  enabled: false

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 320Mi

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.leneu.cloud
  path: /
  pathType: Prefix

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prom-prometheus-server.obs.svc.cluster.local
        isDefault: true
        editable: false
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.obs.svc.cluster.local:3100
        editable: false
        jsonData:
          derivedFields:
            - name: trace_id
              matcherRegex: "trace_id=([0-9a-f]{32})"
              datasourceUid: tempo
              url: "$${__value.raw}"
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.obs.svc.cluster.local:3200
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            tags:
              - key: service.name
                value: app
              - key: k8s.namespace.name
                value: namespace
            filterByTraceID: true
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
          serviceMap:
            datasourceUid: prometheus

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Jaywiki
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

