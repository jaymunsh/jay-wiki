apiVersion: v1
kind: ResourceQuota
metadata:
  name: rehearsal-budget
  namespace: rehearsal
spec:
  hard:
    pods: "2"
    count/jobs.batch: "2"
    requests.cpu: "1"
    requests.memory: 128Mi
    limits.cpu: "1"
    limits.memory: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rehearsal-egress
  namespace: rehearsal
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend
          podSelector:
            matchLabels:
              app: jaywiki
      ports:
        - protocol: TCP
          port: 8080
