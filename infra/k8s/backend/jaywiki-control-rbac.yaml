apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaywiki-control-panel
  namespace: backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jaywiki-scale-opensearch
  namespace: data
rules:
  - apiGroups:
      - apps
    resources:
      - statefulsets/scale
    resourceNames:
      - secure-search
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jaywiki-scale-opensearch
  namespace: data
subjects:
  - kind: ServiceAccount
    name: jaywiki-control-panel
    namespace: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jaywiki-scale-opensearch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jaywiki-hpa-rehearsal
  namespace: backend
rules:
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    resourceNames: ["jaywiki"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["jaywiki"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jaywiki-hpa-rehearsal
  namespace: backend
subjects:
  - kind: ServiceAccount
    name: jaywiki-control-panel
    namespace: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jaywiki-hpa-rehearsal
---
# Workload creation belongs in a namespace with no application secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jaywiki-load-jobs
  namespace: rehearsal
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jaywiki-load-jobs
  namespace: rehearsal
subjects:
  - kind: ServiceAccount
    name: jaywiki-control-panel
    namespace: backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jaywiki-load-jobs
