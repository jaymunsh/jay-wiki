apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jaywiki-omok-data
  namespace: frontend
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaywiki-omok
  namespace: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaywiki-omok
  template:
    metadata:
      labels:
        app: jaywiki-omok
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: jaywiki-omok
          image: jaywiki-omok:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: DATA_DIR
              value: /app/data
            - name: PUBLIC_ORIGIN
              value: https://game.leneu.cloud
            - name: PUBLIC_PATH
              value: /omok
            - name: TRUST_CLOUDFLARE
              value: '1'
            - name: MAX_ROOMS
              value: '100'
          volumeMounts:
            - name: games
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /omok/health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /omok/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: games
          persistentVolumeClaim:
            claimName: jaywiki-omok-data
---
apiVersion: v1
kind: Service
metadata:
  name: jaywiki-omok
  namespace: frontend
spec:
  type: ClusterIP
  selector:
    app: jaywiki-omok
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaywiki-omok
  namespace: frontend
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: frontend-jaywiki-public-https-origin@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: game.leneu.cloud
      http:
        paths:
          - path: /omok
            pathType: Prefix
            backend:
              service:
                name: jaywiki-omok
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaywiki-omok
  namespace: frontend
spec:
  podSelector:
    matchLabels:
      app: jaywiki-omok
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
  egress: []
