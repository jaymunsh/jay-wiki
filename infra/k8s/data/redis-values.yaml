# bitnami/redis — 조회수, 채팅 room/queue, rate limit 같은 단기 상태 전용.
#
#   helm upgrade -i redis bitnami/redis -n data -f infra/k8s/data/redis-values.yaml
#
# 영속성을 끈다. 여기 담긴 데이터는 전부 재생성 가능하고, 백업 대상이 아니다.
# auth.enabled=false 는 클러스터 내부 통신 한정이다. 외부로 노출하지 않는다.
architecture: standalone

auth:
  enabled: false

# 차트 기본값은 6379 를 모든 출처에 여는 정책을 만든다. 그렇다고 차트로 좁히지도 않는다 --
# allowExternal: false 를 줘도 "같은 네임스페이스에서 redis-client: true 라벨을 단 파드" 항목이
# 항상 따라붙고, ingress 는 합집합이라 그 한 줄이 정책 전체를 넓힌다. 끌 수 있는 값이 없다.
# 그래서 차트 정책은 끄고 redis-network-policy.yaml 로 직접 쓴다.
# 이 값을 true 로 되돌리면 그 라벨 경로가 같이 살아난다.
networkPolicy:
  enabled: false

master:
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 256Mi
  persistence:
    size: 2Gi
  extraFlags:
    - --maxmemory
    - 200mb
    - --maxmemory-policy
    - allkeys-lru
    - --appendonly
    - "no"
