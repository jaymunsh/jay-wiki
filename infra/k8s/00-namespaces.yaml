# data 와 obs 는 Helm 차트(PostgreSQL/Redis/MinIO/OpenSearch, kube-prometheus-stack/Loki/Tempo)로
# 설치하지만, backup CronJob·Kafka StatefulSet·OTel 엔드포인트가 이 이름을 참조하므로
# 클린 클러스터에서도 파이프라인이 먼저 만들 수 있어야 한다.
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: obs
---
apiVersion: v1
kind: Namespace
metadata:
  name: rehearsal
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
