apiVersion: v1
kind: Secret
metadata:
  name: jaywiki-secrets
  namespace: backend
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "replace-with-postgres-password"
  APP_JWT_SECRET: "replace-with-32-byte-random-secret"
  APP_ADMIN_PASSWORD: "replace-with-random-admin-password"
  APP_ADMIN_TOTP_ENABLED: "false"
  APP_ADMIN_TOTP_SECRET: "replace-with-base32-totp-secret"
  APP_MINIO_ACCESS_KEY: "replace-with-minio-service-account-access-key"
  APP_MINIO_SECRET_KEY: "replace-with-minio-service-account-secret-key"
  # payment-api 가 pg-services 의 payment DB 에 붙는 주소. 비밀번호는 아래 PAYMENT_SVC_PASSWORD 와 같아야 한다.
  PAYMENT_DB_DSN: "postgresql://payment_svc:replace-with-payment-svc-password@pg-services.data.svc.cluster.local:5432/payment"
  # shipping-api 쪽. 계정이 다르다 -- shipping_svc 는 payment DB 에 CONNECT 가 없다.
  SHIPPING_DB_DSN: "postgresql://shipping_svc:replace-with-shipping-svc-password@pg-services.data.svc.cluster.local:5432/shipping"
---
apiVersion: v1
kind: Secret
metadata:
  name: pg-services-secrets
  namespace: data
type: Opaque
stringData:
  # 영숫자로 만든다 -- initdb 스크립트가 SQL 문자열 리터럴에 그대로 끼워 넣는다(작은따옴표가 들어가면 깨진다).
  POSTGRES_PASSWORD: "replace-with-pg-services-superuser-password"
  PAYMENT_SVC_PASSWORD: "replace-with-payment-svc-password"
  SHIPPING_SVC_PASSWORD: "replace-with-shipping-svc-password"
