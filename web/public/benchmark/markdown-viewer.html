<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown artifact viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.3/marked.min.js"></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: clamp(24px, 5vw, 64px);
      font: 16px/1.75 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #334155;
      background: #fff;
    }
    article { max-width: 760px; margin: auto; }
    h1 { margin: 0 0 1.6rem; padding-bottom: .65rem; border-bottom: 2px solid #e2e8f0; color: #0f172a; font-size: 2rem; line-height: 1.25; }
    h2 { margin: 2rem 0 .65rem; color: #0f172a; font-size: 1.4rem; }
    h3 { margin: 1.5rem 0 .5rem; color: #1e293b; font-size: 1.1rem; }
    p, ul, ol, table, pre, blockquote { margin: .8rem 0; }
    a { color: #4f46e5; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    th, td { padding: .6rem; border: 1px solid #dbe3ee; text-align: left; vertical-align: top; }
    th { color: #1e293b; background: #f8fafc; }
    pre { overflow: auto; padding: 1rem; border-radius: .75rem; color: #e2e8f0; background: #0f172a; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
    p code, li code, td code { padding: .12rem .3rem; border-radius: .3rem; color: #4338ca; background: #f1f5f9; }
    blockquote { padding: .65rem 1rem; border-left: 4px solid #818cf8; color: #475569; background: #eef2ff; }
    hr { margin: 2rem 0; border: 0; border-top: 1px solid #e2e8f0; }
    .state { color: #64748b; }
    .error { color: #b45309; }
  </style>
</head>
<body>
  <article id="content"><p class="state">문서를 불러오는 중...</p></article>
  <script>
    const content = document.getElementById('content');
    const source = new URLSearchParams(location.search).get('source');

    async function renderDocument() {
      if (!source || !source.startsWith('runs/') || source.includes('..')) throw new Error('허용되지 않은 문서 경로입니다.');
      const response = await fetch(source);
      if (!response.ok) throw new Error(`문서를 불러오지 못했습니다. (HTTP ${response.status})`);
      const markdown = await response.text();
      // Candidate HTML is displayed as text so the comparison viewer never executes it.
      const safeMarkdown = markdown.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
      if (window.marked) content.innerHTML = window.marked.parse(safeMarkdown);
      else content.innerHTML = `<pre>${safeMarkdown}</pre>`;
    }

    renderDocument().catch((error) => {
      content.innerHTML = `<p class="error">${String(error.message || error)}</p>`;
    });
  </script>
</body>
</html>
