<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leneu Blocks</title>
<style>
:root{color-scheme:dark;--bg:#0d1320;--panel:#151f31;--line:#2a3952;--ink:#edf3ff;--muted:#9cadc5;--accent:#7dd3fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1d3150 0,#0d1320 47%);font:15px system-ui,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:22px}.game{width:min(760px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}h1{font-size:22px;letter-spacing:-.03em;margin:0}button{font:inherit;color:var(--ink);border:1px solid var(--line);background:#1b2940;border-radius:9px;padding:9px 12px;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent);outline:2px solid #315a78;outline-offset:2px}.layout{display:grid;grid-template-columns:minmax(280px,320px) 1fr;gap:16px;align-items:start}.board-shell{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;position:relative;box-shadow:0 20px 55px #0005}.board-shell canvas{display:block;width:100%;height:auto;background:#09101c;border-radius:9px}.overlay{position:absolute;inset:12px;display:none;place-items:center;background:#09101cbb;border-radius:9px;text-align:center;padding:18px}.overlay.show{display:grid}.overlay strong{font-size:25px;display:block}.overlay p{color:var(--muted);margin:8px 0 14px}.side{display:grid;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px}.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}.next-canvas,.hold-canvas{display:block;width:128px;height:78px;background:#0b1320;border-radius:8px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#0e1828;border-radius:9px;padding:10px}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{font-size:22px}.keys{color:var(--muted);line-height:1.8;font-size:13px}.keys kbd{display:inline-block;border:1px solid #496078;border-radius:4px;padding:0 5px;color:var(--ink);font-size:11px}.status{min-height:22px;color:var(--accent);font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap}.hint{margin:14px 0 0;color:var(--muted);font-size:12px}@media(max-width:650px){body{padding:13px}.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.card.stats-card,.card.keys-card{grid-column:span 2}.next-canvas,.hold-canvas{width:100%;height:70px}}
</style></head><body><main class="game"><header><h1>▦ Leneu Blocks</h1><button id="restart" type="button">재시작 <kbd>R</kbd></button></header><div class="layout"><section class="board-shell"><canvas id="board" width="300" height="600" aria-label="10 x 20 테트리스 보드"></canvas><div class="overlay" id="overlay"><div><strong id="overlayTitle">일시정지</strong><p id="overlayText">P를 눌러 계속합니다.</p><button id="overlayRestart" type="button">재시작</button></div></div></section><aside class="side"><div class="card"><h2>다음 블록</h2><canvas class="next-canvas" id="next" width="128" height="78"></canvas></div><div class="card"><h2>보관 (C / Shift)</h2><canvas class="hold-canvas" id="hold" width="128" height="78"></canvas></div><div class="card stats-card"><div class="stats"><div class="stat"><span>점수</span><b id="score">0</b></div><div class="stat"><span>줄</span><b id="lines">0</b></div></div></div><div class="card keys-card"><h2>조작</h2><div class="keys"><kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>↑</kbd> 회전<br><kbd>↓</kbd> 빠른 낙하 · <kbd>Space</kbd> 즉시 낙하<br><kbd>C</kbd>/<kbd>Shift</kbd> 보관 · <kbd>P</kbd> 일시정지</div><p class="status" id="status" aria-live="polite"></p></div></aside></div><p class="hint">7종 블록 · Hold는 블록 하나가 고정될 때까지 한 번만 사용할 수 있습니다.</p></main>
<script>
const W=10,H=20,cell=30,canvas=document.getElementById('board'),ctx=canvas.getContext('2d');
const nextCanvas=document.getElementById('next'),nextCtx=nextCanvas.getContext('2d'),holdCanvas=document.getElementById('hold'),holdCtx=holdCanvas.getContext('2d');
const COLORS={I:'#60d9ff',J:'#7395ff',L:'#ffad66',O:'#ffe175',S:'#77e39b',T:'#d695ff',Z:'#ff7188'};
const SHAPES={I:[[1,1,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]],O:[[1,1],[1,1]],S:[[0,1,1],[1,1,0]],T:[[0,1,0],[1,1,1]],Z:[[1,1,0],[0,1,1]]};
let board,current,next,hold=null,canHold=true,score=0,lines=0,paused=false,over=false,last=0,dropMs=700;
const bag=()=>{const a=Object.keys(SHAPES);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};let queue=[];
function pull(){if(!queue.length)queue=bag();return queue.shift()}
function make(type){return{type,shape:SHAPES[type].map(r=>r.slice()),x:Math.floor((W-SHAPES[type][0].length)/2),y:0}}
function reset(){board=Array.from({length:H},()=>Array(W).fill(null));queue=[];next=pull();hold=null;score=0;lines=0;paused=false;over=false;canHold=true;spawn();hideOverlay();announce('새 게임');draw()}
function spawn(type=next){current=make(type);next=pull();canHold=true;if(collides(current)){over=true;showOverlay('게임 오버','재시작하려면 R을 누르세요.');announce('게임 오버')}}
function collides(p){for(let y=0;y<p.shape.length;y++)for(let x=0;x<p.shape[y].length;x++)if(p.shape[y][x]){const bx=p.x+x,by=p.y+y;if(bx<0||bx>=W||by>=H||(by>=0&&board[by][bx]))return true}return false}
function move(dx){if(paused||over)return;current.x+=dx;if(collides(current))current.x-=dx;draw()}
function rotate(){if(paused||over)return;const old=current.shape;const h=old.length,w=old[0].length;const turned=Array.from({length:w},(_,y)=>Array.from({length:h},(_,x)=>old[h-1-x][y]));current.shape=turned;if(collides(current))current.shape=old;draw()}
function soft(){if(paused||over)return;if(!drop(1))lock();draw()}
function drop(dy){current.y+=dy;if(collides(current)){current.y-=dy;return false}return true}
function hard(){if(paused||over)return;while(drop(1)){}lock();draw()}
function holdPiece(){if(paused||over||!canHold)return;const type=current.type;if(hold===null){hold=type;spawn()}else{const swap=hold;hold=type;current=make(swap);if(collides(current)){over=true;showOverlay('게임 오버','보관 블록 생성 위치가 막혔습니다.')}}canHold=false;announce('보관 블록을 교환했습니다');draw()}
function lock(){for(let y=0;y<current.shape.length;y++)for(let x=0;x<current.shape[y].length;x++)if(current.shape[y][x]&&current.y+y>=0)board[current.y+y][current.x+x]=current.type;clearLines();spawn()}
function clearLines(){const kept=board.filter(row=>row.some(v=>!v));const n=H-kept.length;while(kept.length<H)kept.unshift(Array(W).fill(null));board=kept;if(n){const pts=[0,100,300,500,800][n];score+=pts;lines+=n;announce(`${n}줄 제거 +${pts}점`)}}
function drawCell(c,x,y,size=cell){c.fillStyle=COLORS[x.type||x];c.fillRect(x.x*size+1,y*size+1,size-2,size-2);c.fillStyle='#ffffff38';c.fillRect(x.x*size+3,y*size+3,size-6,3)}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#162337';for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*cell,0);ctx.lineTo(x*cell,H*cell);ctx.stroke()}for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*cell);ctx.lineTo(W*cell,y*cell);ctx.stroke()}board.forEach((row,y)=>row.forEach((type,x)=>type&&drawCell(ctx,{type,x,y})));if(current&&!over)current.shape.forEach((row,y)=>row.forEach((v,x)=>v&&drawCell(ctx,{type:current.type,x:current.x+x,y:current.y+y})));drawMini(nextCtx,next);drawMini(holdCtx,hold);document.getElementById('score').textContent=score;document.getElementById('lines').textContent=lines}
function drawMini(c,type){c.clearRect(0,0,128,78);if(!type)return;const shape=SHAPES[type],size=18;const ox=(128-shape[0].length*size)/2,oy=(78-shape.length*size)/2;c.fillStyle=COLORS[type];shape.forEach((r,y)=>r.forEach((v,x)=>{if(v){c.fillRect(ox+x*size+1,oy+y*size+1,size-2,size-2)}}))}
function showOverlay(title,text){document.getElementById('overlayTitle').textContent=title;document.getElementById('overlayText').textContent=text;document.getElementById('overlay').classList.add('show')}
function hideOverlay(){document.getElementById('overlay').classList.remove('show')}
function togglePause(){if(over)return;paused=!paused;if(paused)showOverlay('일시정지','P를 눌러 계속합니다.');else hideOverlay();announce(paused?'일시정지':'계속');draw()}
function announce(s){document.getElementById('status').textContent=s}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' ','Shift'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')move(-1);else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowDown')soft();else if(e.key==='ArrowUp')rotate();else if(e.key===' ')hard();else if(e.key==='c'||e.key==='C'||e.key==='Shift')holdPiece();else if(e.key==='p'||e.key==='P')togglePause();else if(e.key==='r'||e.key==='R')reset()});
document.getElementById('restart').onclick=reset;document.getElementById('overlayRestart').onclick=reset;
function loop(t){if(!last)last=t;const dt=t-last;last=t;if(!paused&&!over&&dt>=dropMs){soft();last=t}requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>
