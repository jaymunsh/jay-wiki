<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leneu Run — 플랫폼 스테이지</title><style>
:root{--ink:#eef7ff;--muted:#b3c6d6;--panel:#132536;--line:#2d4b62;--accent:#9ef0c7}*{box-sizing:border-box}body{margin:0;background:#08141e;color:var(--ink);font:15px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.game{width:min(980px,100%)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}h1{font-size:21px;margin:0;letter-spacing:-.03em}.hud{display:flex;gap:15px;color:var(--muted);font-size:13px}.hud b{color:var(--ink)}.canvas-wrap{position:relative;background:#0c2030;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 22px 60px #0006}.canvas-wrap canvas{display:block;width:100%;height:auto;border-radius:10px;background:#94cce6;image-rendering:auto}.overlay{position:absolute;inset:10px;display:none;place-items:center;background:#06121dd9;border-radius:10px;text-align:center}.overlay.show{display:grid}.overlay strong{display:block;font-size:30px}.overlay p{color:var(--muted)}button{border:1px solid var(--line);background:#19364b;color:var(--ink);border-radius:9px;padding:9px 13px;font:inherit;cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent);outline:2px solid #427e70;outline-offset:2px}.instructions{display:flex;justify-content:space-between;gap:18px;color:var(--muted);font-size:13px;margin-top:12px}.instructions kbd{border:1px solid #547086;padding:1px 5px;border-radius:4px;color:var(--ink)}@media(max-width:600px){body{padding:10px}.hud{gap:7px;font-size:11px}.instructions{display:block;line-height:1.8}}
</style></head><body><main class="game"><header><h1>◈ Leneu Run</h1><div class="hud"><span>코인 <b id="coins">0/3</b></span><span>시간 <b id="time">0.0s</b></span><button id="restart" type="button">재시작 <kbd>R</kbd></button></div></header><div class="canvas-wrap"><canvas id="game" width="900" height="400" aria-label="플랫폼 게임 월드"></canvas><div class="overlay" id="overlay"><div><strong id="overlayTitle">스테이지 클리어!</strong><p id="overlayText"></p><button id="overlayRestart">다시 시작</button></div></div></div><div class="instructions"><span><kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>↑</kbd>/<kbd>Space</kbd> 점프 (지면에서만)</span><span>적은 위에서 밟고, 깃발까지 달려가세요.</span></div></main><script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),VW=900,VH=400,WORLD_W=2400,WORLD_H=600;const keys=new Set();
const grounds=[{x:0,y:520,w:650,h:80},{x:780,y:520,w:720,h:80},{x:1640,y:520,w:760,h:80}],platforms=[{x:350,y:410,w:160,h:20},{x:1100,y:400,w:180,h:20},{x:1800,y:380,w:180,h:20}];
const coinStart=[{x:420,y:370},{x:1170,y:360},{x:1860,y:340}],enemyStart=[{x:900,y:476,min:900,max:1040},{x:2000,y:476,min:2000,max:2180}];
let player,enemies,coins,camera=0,started=0,elapsed=0,running=true,cleared=false,last=0;
function reset(){player={x:80,y:476,w:32,h:44,vx:0,vy:0,onGround:false};enemies=enemyStart.map(e=>({...e,w:32,h:44,vx:65,alive:true}));coins=coinStart.map(c=>({...c,got:false}));camera=0;started=performance.now();elapsed=0;running=true;cleared=false;hideOverlay();announce();draw()}
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function solids(){return grounds.concat(platforms)}
function movePlayer(dt){const left=keys.has('ArrowLeft')||keys.has('a'),right=keys.has('ArrowRight')||keys.has('d');player.vx=(right?210:0)-(left?210:0);if((keys.has('ArrowUp')||keys.has(' ')||keys.has('w'))&&player.onGround){player.vy=-430;player.onGround=false}player.vy+=1050*dt;let nx=player.x+player.vx*dt,ny=player.y+player.vy*dt;const oldY=player.y;for(const s of solids()){if(nx< s.x+s.w&&nx+player.w>s.x&&player.y<s.y+s.h&&player.y+player.h>s.y+1){if(player.vx>0)nx=s.x-player.w;else if(player.vx<0)nx=s.x+s.w;player.vx=0}}player.onGround=false;for(const s of solids()){const horizontal=nx<s.x+s.w&&nx+player.w>s.x;if(horizontal&&oldY+player.h<=s.y&&ny+player.h>=s.y){ny=s.y-player.h;player.vy=0;player.onGround=true}else if(horizontal&&oldY>=s.y+s.h&&ny<=s.y+s.h){ny=s.y+s.h;player.vy=0}}player.x=Math.max(0,Math.min(WORLD_W-player.w,nx));player.y=ny}
function moveEnemies(dt){for(const e of enemies)if(e.alive){e.x+=e.vx*dt;if(e.x<=e.min){e.x=e.min;e.vx=Math.abs(e.vx)}if(e.x>=e.max){e.x=e.max;e.vx=-Math.abs(e.vx)}if(rectsOverlap(player,e)){const falling=player.vy>0&&player.y+player.h-e.y<18;if(falling){e.alive=false;player.vy=-300}else die('적과 부딪혔습니다.')}}}
function collect(){for(const c of coins)if(!c.got&&Math.hypot(player.x+player.w/2-c.x,player.y+player.h/2-c.y)<25)c.got=true}
function die(msg){if(!running)return;running=false;showOverlay('실패',msg+' 다시 시작하세요.');draw()}
function update(dt){if(!running)return;movePlayer(dt);moveEnemies(dt);collect();elapsed=(performance.now()-started)/1000;if(player.y>WORLD_H+80)die('낭떠러지로 떨어졌습니다.');if(player.x+player.w>=2310){running=false;cleared=true;showOverlay('스테이지 클리어!',`코인 ${coins.filter(c=>c.got).length}/3 · ${elapsed.toFixed(1)}초`)}camera=Math.max(0,Math.min(WORLD_W-VW,player.x-300));document.getElementById('coins').textContent=coins.filter(c=>c.got).length+'/3';document.getElementById('time').textContent=elapsed.toFixed(1)+'s'}
function draw(){const sky=ctx.createLinearGradient(0,0,0,VH);sky.addColorStop(0,'#87cbe7');sky.addColorStop(1,'#d9f2ed');ctx.fillStyle=sky;ctx.fillRect(0,0,VW,VH);ctx.save();ctx.translate(-camera,0);drawWorld();ctx.restore()}
function drawWorld(){ctx.fillStyle='#b3dfd2';ctx.beginPath();ctx.moveTo(camera-40,280);ctx.lineTo(camera+300,170);ctx.lineTo(camera+620,280);ctx.lineTo(camera+900,145);ctx.lineTo(camera+1250,280);ctx.lineTo(camera+1550,170);ctx.lineTo(camera+1900,280);ctx.lineTo(camera+2450,120);ctx.lineTo(camera+2450,520);ctx.lineTo(camera-40,520);ctx.fill();for(const s of grounds){ctx.fillStyle='#3b6b58';ctx.fillRect(s.x,s.y,s.w,s.h);ctx.fillStyle='#6ec488';ctx.fillRect(s.x,s.y,s.w,8)}for(const p of platforms){ctx.fillStyle='#735e96';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#c59ce7';ctx.fillRect(p.x,p.y,p.w,5)}for(const c of coins)if(!c.got){ctx.fillStyle='#ffd866';ctx.beginPath();ctx.arc(c.x,c.y,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff3a1';ctx.lineWidth=3;ctx.stroke()}for(const e of enemies)if(e.alive){ctx.fillStyle='#ee6e7d';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#fff';ctx.fillRect(e.x+6,e.y+10,6,7);ctx.fillRect(e.x+20,e.y+10,6,7);ctx.fillStyle='#27354d';ctx.fillRect(e.x+8,e.y+12,3,4);ctx.fillRect(e.x+22,e.y+12,3,4)}ctx.fillStyle='#6b4aa0';ctx.fillRect(2310,300,7,220);ctx.fillStyle='#f5c85a';ctx.beginPath();ctx.moveTo(2317,305);ctx.lineTo(2380,325);ctx.lineTo(2317,345);ctx.fill();ctx.fillStyle='#f5a3c6';ctx.fillRect(player.x,player.y,player.w,player.h);ctx.fillStyle='#1f3a53';ctx.fillRect(player.x+6,player.y+10,6,6);ctx.fillRect(player.x+21,player.y+10,6,6);ctx.fillStyle='#fff';ctx.fillRect(player.x+8,player.y+11,3,3);ctx.fillRect(player.x+23,player.y+11,3,3)}
function showOverlay(title,text){document.getElementById('overlayTitle').textContent=title;document.getElementById('overlayText').textContent=text;document.getElementById('overlay').classList.add('show')};function hideOverlay(){document.getElementById('overlay').classList.remove('show')};function announce(){document.getElementById('time').textContent='0.0s'}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w'].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key==='r'||e.key==='R')reset()});addEventListener('keyup',e=>keys.delete(e.key));document.getElementById('restart').onclick=reset;document.getElementById('overlayRestart').onclick=reset;
function loop(t){const dt=Math.min(.033,(t-last||16)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);
</script></body></html>
