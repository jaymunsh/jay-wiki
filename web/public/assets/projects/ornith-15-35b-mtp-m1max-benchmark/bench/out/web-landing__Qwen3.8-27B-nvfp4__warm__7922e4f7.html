<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BENCH·PRESS — 로컬 LLM 벤치마크</title>
<style>
  :root{
    --ink:#171512; --ink-soft:#38322a;
    --paper:#f4efe4; --paper-2:#e9e1d1; --paper-3:#ded4c0;
    --line:rgba(23,21,18,.16); --line-strong:rgba(23,21,18,.4);
    --coral:#e04b27; --coral-d:#c03d1c;
    --blue:#2b4a6b; --teal:#1f6f5b; --gold:#a97e28;
    --serif:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--paper);color:var(--ink);
    font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  ::selection{background:var(--coral);color:var(--paper)}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1240px;margin:0 auto;padding:0 24px}
  .kicker{
    font-family:var(--mono);font-size:.72rem;letter-spacing:.22em;
    text-transform:uppercase;color:var(--coral);display:flex;align-items:center;gap:.6em
  }
  .kicker::before{content:"";width:26px;height:1px;background:var(--coral);display:inline-block}

  /* ===== Nav ===== */
  header.nav{
    position:sticky;top:0;z-index:50;background:rgba(244,239,228,.86);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)
  }
  .nav-inner{display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{display:flex;align-items:center;gap:.55em;font-family:var(--mono);
    font-weight:700;letter-spacing:.04em;font-size:.95rem}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--coral);
    box-shadow:0 0 0 3px rgba(224,75,39,.22)}
  .nav-links{display:flex;gap:1.6rem;font-size:.82rem;letter-spacing:.02em}
  .nav-links a{position:relative;padding:4px 0;color:var(--ink-soft)}
  .nav-links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
    background:var(--ink);transition:width .3s}
  .nav-links a:hover{color:var(--ink)} .nav-links a:hover::after{width:100%}
  .nav-cta{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--ink);padding:.55em 1em;border-radius:2px;transition:.25s}
  .nav-cta:hover{background:var(--ink);color:var(--paper)}
  .nav-toggle{display:none}

  /* ===== Hero ===== */
  .hero{padding:64px 0 40px;position:relative}
  .hero-grid{display:grid;grid-template-columns:1.05fr 1.35fr;gap:48px;align-items:center}
  .hero h1{
    font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,6.4vw,5.4rem);
    line-height:.98;letter-spacing:-.02em;margin:1.1rem 0 1.3rem
  }
  .hero h1 em{font-style:italic;color:var(--coral)}
  .hero p.lead{font-size:1.08rem;max-width:34ch;color:var(--ink-soft);margin-bottom:2rem}
  .hero .meta{display:flex;flex-wrap:wrap;gap:1.4rem;align-items:center;font-family:var(--mono);font-size:.74rem}
  .hero .meta b{display:block;font-size:1.3rem;font-family:var(--serif);letter-spacing:0;color:var(--ink)}
  .hero .meta span{color:var(--ink-soft);letter-spacing:.04em}
  .hero .ver{border:1px solid var(--line);border-radius:40px;padding:.35em .9em;background:var(--paper-2)}

  /* live dashboard card */
  .console{
    background:var(--ink);color:var(--paper);border-radius:10px;padding:22px 22px 20px;
    box-shadow:0 30px 60px -30px rgba(23,21,18,.55);position:relative;overflow:hidden
  }
  .console::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 80% at 100% 0,rgba(224,75,39,.16),transparent 60%)}
  .c-head{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
    color:rgba(244,239,228,.6);margin-bottom:16px}
  .c-head .live{color:var(--coral);display:flex;align-items:center;gap:.5em}
  .c-head .live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--coral);
    animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  .c-stat{display:flex;justify-content:space-between;align-items:flex-end;
    padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid rgba(244,239,228,.14)}
  .c-stat .label{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:rgba(244,239,228,.55)}
  .c-stat .val{font-family:var(--serif);font-size:2.6rem;line-height:1;letter-spacing:-.02em}
  .c-stat .val small{font-family:var(--mono);font-size:.8rem;color:rgba(244,239,228,.6);margin-left:.35em}
  .c-bars{display:flex;flex-direction:column;gap:11px}
  .bar-row{display:grid;grid-template-columns:130px 1fr 54px;align-items:center;gap:12px;
    font-family:var(--mono);font-size:.74rem}
  .bar-row .name{color:rgba(244,239,228,.78)}
  .bar-track{height:8px;background:rgba(244,239,228,.12);border-radius:2px;overflow:hidden}
  .bar-fill{height:100%;border-radius:2px;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
  .bar-row .num{text-align:right;color:rgba(244,239,228,.9)}
  .f-coral{background:var(--coral)} .f-blue{background:#5b86b3}
  .f-teal{background:#3f9d84} .f-gold{background:#d6a73f}

  /* ===== Ticker ===== */
  .ticker{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:var(--ink);color:var(--paper);overflow:hidden;white-space:nowrap;margin-top:36px}
  .ticker-track{display:inline-flex;gap:2.4rem;padding:.75rem 0;font-family:var(--mono);
    font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;animation:tick 26s linear infinite}
  .ticker-track span{color:rgba(244,239,228,.72)}
  .ticker-track span b{color:var(--coral);font-weight:700}
  @keyframes tick{to{transform:translateX(-50%)}}

  /* ===== Section shell ===== */
  section{padding:88px 0}
  .sec-head{max-width:56ch;margin-bottom:44px}
  .sec-head h2{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4.4vw,3.3rem);
    line-height:1.04;letter-spacing:-.015em;margin:1rem 0 .7rem}
  .sec-head p{color:var(--ink-soft);font-size:1.02rem}

  /* ===== Metrics (sticky two-col) ===== */
  .metrics-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:start}
  .metrics-sticky{position:sticky;top:96px}
  .metrics-sticky h2{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4vw,3rem);
    line-height:1.05;letter-spacing:-.015em;margin:1rem 0 1rem}
  .metrics-sticky p{color:var(--ink-soft);margin-bottom:1.6rem}
  .metrics-list{display:flex;flex-direction:column}
  .m-item{border-top:1px solid var(--line);padding:26px 0;display:grid;
    grid-template-columns:52px 1fr;gap:20px;align-items:start}
  .m-item:last-child{border-bottom:1px solid var(--line)}
  .m-num{font-family:var(--mono);font-size:.82rem;color:var(--coral);letter-spacing:.05em}
  .m-item h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;letter-spacing:-.01em;margin-bottom:.4rem}
  .m-item p{color:var(--ink-soft);font-size:.96rem;max-width:46ch}

  /* ===== Benchmarks (sticky + stacked cards) ===== */
  .bench-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:start}
  .bench-sticky{position:sticky;top:96px}
  .bench-sticky h2{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,4vw,3rem);
    line-height:1.05;letter-spacing:-.015em;margin:1rem 0 1rem}
  .bench-sticky p{color:var(--ink-soft);margin-bottom:1.5rem}
  .bench-tag{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--blue);border:1px solid var(--line);padding:.4em .8em;border-radius:40px}
  .stack{display:flex;flex-direction:column;gap:26px}
  .b-card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:30px;
    position:sticky;top:96px;transition:transform .4s,box-shadow .4s
  }
  .b-card:nth-child(2){top:116px} .b-card:nth-child(3){top:136px}
  .b-card:hover{transform:translateY(-4px);box-shadow:0 24px 40px -28px rgba(23,21,18,.4)}
  .b-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1.4rem}
  .b-top h3{font-family:var(--serif);font-weight:400;font-size:1.7rem;letter-spacing:-.01em}
  .b-top .best{font-family:var(--mono);font-size:.74rem;letter-spacing:.04em}
  .b-top .best b{color:var(--coral)}
  .b-bars{display:flex;flex-direction:column;gap:13px}
  .b-row{display:grid;grid-template-columns:150px 1fr 58px;align-items:center;gap:14px}
  .b-row .bn{font-size:.9rem;font-weight:600}
  .b-row .bn small{display:block;font-family:var(--mono);font-weight:400;font-size:.68rem;color:var(--ink-soft)}
  .b-track{height:12px;background:var(--paper-3);border-radius:3px;overflow:hidden}
  .b-fill{height:100%;width:0;border-radius:3px;transition:width 1.2s cubic-bezier(.2,.85,.25,1)}
  .b-row .bval{font-family:var(--mono);font-size:.86rem;text-align:right;font-weight:600}
  .b-row.win .bval{color:var(--coral)} .b-row.win .b-fill{background:var(--coral)}
  .b-row .b-fill{background:var(--blue)}
  .b-foot{margin-top:1.3rem;font-family:var(--mono);font-size:.72rem;color:var(--ink-soft);
    letter-spacing:.03em;border-top:1px solid var(--line);padding-top:1rem}

  /* ===== Pipeline (dark) ===== */
  .dark{background:var(--ink);color:var(--paper)}
  .dark .kicker{color:var(--coral)}
  .dark .sec-head p{color:rgba(244,239,228,.62)}
  .pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:12px;
    counter-reset:step;position:relative}
  .pipe::before{content:"";position:absolute;top:26px;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--coral),rgba(244,239,228,.15))}
  .p-step{padding:0 18px;position:relative}
  .p-node{width:52px;height:52px;border-radius:50%;background:var(--ink);border:2px solid var(--coral);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;
    font-size:.9rem;position:relative;z-index:2;margin-bottom:22px}
  .p-step h4{font-family:var(--serif);font-weight:400;font-size:1.3rem;margin-bottom:.5rem}
  .p-step p{color:rgba(244,239,228,.6);font-size:.9rem}

  /* ===== Features bento ===== */
  .bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(150px,auto);gap:18px}
  .tile{border:1px solid var(--line);border-radius:12px;padding:26px;background:var(--paper-2);
    transition:transform .35s,background .35s;position:relative;overflow:hidden}
  .tile:hover{transform:translateY(-5px);background:var(--paper)}
  .tile h3{font-family:var(--serif);font-weight:400;font-size:1.4rem;letter-spacing:-.01em;margin-bottom:.5rem}
  .tile p{color:var(--ink-soft);font-size:.92rem;max-width:34ch}
  .tile .ic{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--coral);margin-bottom:1
