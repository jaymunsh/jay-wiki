<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>벤치마크 — 로컬 LLM 벤치마크 도구</title>
<style>
  :root{
    --paper:#141821;
    --paper-2:#191e2a;
    --card:#1e2431;
    --card-2:#232b3a;
    --line:rgba(255,255,255,.09);
    --line-strong:rgba(255,255,255,.18);
    --ink:#eef1f6;
    --ink-2:#aab3c5;
    --ink-3:#6b7688;
    --amber:#f5a524;
    --amber-2:#ffca5c;
    --teal:#37d3b5;
    --rose:#ff7a7a;
    --violet:#9d8bff;
    --blue:#63a3ff;
    --grid:rgba(255,255,255,.045);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .mono{font-family:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;}
  ::selection{background:var(--amber);color:#141821;}
  a{color:inherit;text-decoration:none;}
  img,svg{display:block;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,5vw,56px);}

  /* ---------- background ---------- */
  .bg{position:fixed;inset:0;z-index:-1;pointer-events:none;}
  .bg::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(900px 600px at 85% -5%, rgba(245,165,36,.10), transparent 60%),
      radial-gradient(700px 700px at -10% 30%, rgba(55,211,181,.07), transparent 60%),
      radial-gradient(700px 500px at 60% 110%, rgba(157,139,255,.07), transparent 60%);
  }
  .bg::after{
    content:"";position:absolute;inset:-2px;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(circle at 50% 30%, #000 30%, transparent 85%);
    animation:gridDrift 26s linear infinite;
  }
  @keyframes gridDrift{to{background-position:34px 34px;}}

  /* ---------- nav ---------- */
  header{position:sticky;top:0;z-index:50;transition:background .3s,border-color .3s;}
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;padding:16px 0;border-bottom:1px solid transparent;
  }
  header.scrolled{background:rgba(14,18,26,.72);backdrop-filter:blur(14px);}
  header.scrolled .nav{border-color:var(--line);}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em;font-size:19px;}
  .brand .mark{
    width:30px;height:30px;display:grid;place-items:center;border-radius:8px;
    background:linear-gradient(160deg,var(--amber),#c9781a);color:#141821;
    box-shadow:0 6px 18px rgba(245,165,36,.35);
  }
  .brand small{color:var(--ink-3);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;}
  .nav-links{display:flex;gap:28px;align-items:center;font-size:14.5px;color:var(--ink-2);}
  .nav-links a{transition:color .2s;position:relative;}
  .nav-links a:hover{color:var(--ink);}
  .nav-links a::after{content:"";position:absolute;left:0;bottom:-6px;width:0;height:2px;background:var(--amber);transition:width .25s;}
  .nav-links a:hover::after{width:100%;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;cursor:pointer;
    font-weight:700;font-size:14px;border-radius:10px;padding:11px 18px;
    border:1px solid transparent;transition:transform .2s,box-shadow .2s,background .2s,border-color .2s;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--amber);color:#141821;box-shadow:0 10px 26px rgba(245,165,36,.28);}
  .btn-primary:hover{background:var(--amber-2);box-shadow:0 14px 34px rgba(245,165,36,.4);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);}
  .btn-ghost:hover{background:rgba(255,255,255,.06);border-color:var(--ink-2);}
  .nav .btn{padding:9px 16px;}
  .menu-toggle{display:none;}

  /* ---------- section scaffolding ---------- */
  section{position:relative;}
  .pad{padding:clamp(70px,9vw,120px) 0;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;color:var(--amber-2);
  }
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--amber);opacity:.7;}
  .h-lead{
    font-size:clamp(30px,5.4vw,58px);line-height:1.04;letter-spacing:-.035em;
    font-weight:800;margin:20px 0;
  }
  .h-lead em{color:var(--amber);font-style:normal;}
  .sub{color:var(--ink-2);font-size:clamp(16px,2vw,19px);max-width:64ch;}

  /* ---------- hero ---------- */
  .hero{padding-top:clamp(48px,7vw,80px);padding-bottom:clamp(50px,7vw,90px);}
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,5vw,64px);align-items:center;}
  .hero-status{
    display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);
    border:1px solid var(--line);border-radius:999px;padding:7px 15px;margin-bottom:22px;
    background:rgba(255,255,255,.02);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(55,211,181,.5);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(55,211,181,.5);}70%{box-shadow:0 0 0 9px rgba(55,211,181,0);}100%{box-shadow:0 0 0 0 rgba(55,211,181,0);}}
  .hero h1{
    font-size:clamp(38px,6.6vw,74px);line-height:1.02;letter-spacing:-.04em;font-weight:800;margin:0 0 22px;
  }
  .hero h1 .g{color:var(--amber);}
  .hero p.lead{color:var(--ink-2);font-size:clamp(16px,2.1vw,20px);max-width:56ch;margin:0 0 30px;}
  .hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:34px;}
  .hero-metric{display:flex;gap:34px;flex-wrap:wrap;color:var(--ink-3);}
  .hero-metric div{font-size:13px;}
  .hero-metric b{display:block;font-size:22px;color:var(--ink);letter-spacing:-.02em;font-weight:800;}

  /* ---------- console (hero visual) ---------- */
  .console{
    background:linear-gradient(180deg,var(--card-2),var(--card));
    border:1px solid var(--line-strong);border-radius:16px;overflow:hidden;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.02) inset;
    animation:float 7s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .console-bar{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.18);}
  .cbtn{width:11px;height:11px;border-radius:50%;background:var(--line-strong);}
  .cbtn.r{background:var(--rose);} .cbtn.y{background:var(--amber);} .cbtn.g{background:var(--teal);}
  .console-bar .path{margin-left:10px;font-size:12.5px;color:var(--ink-3);letter-spacing:.02em;}
  .console-bar .run{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--teal);display:flex;align-items:center;gap:7px;}
  .run .live{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite;}
  .console-body{padding:18px 18px 20px;}
  .bench-name{font-size:13px;color:var(--ink-3);margin-bottom:4px;}
  .bench-title{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-bottom:16px;}
  .bench-title span{color:var(--amber-2);}
  .bench-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:14px;}
  .bench-row .meta{display:flex;justify-content:space-between;align-items:baseline;}
  .bench-row .val{font-size:14px;font-weight:700;color:var(--ink);}
  .bench-row .val small{color:var(--ink-3);font-weight:600;font-size:11px;margin-left:3px;}
  .bench-row .lab{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;}
  .bar{grid-column:1 / -1;height:8px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden;position:relative;}
  .bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--amber),var(--amber-2));transition:width 1.1s cubic-bezier(.2,.8,.2,1);position:relative;}
  .bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shine 2.4s infinite;}
  @keyframes shine{100%{transform:translateX(100%);}}
  .bench-foot{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);}
  .bench-foot b{color:var(--ink);font-weight:700;}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:rgba(255,255,255,.03);}
  .chip.ok{color:var(--teal);border-color:rgba(55,211,181,.35);}
  .chip.warn{color:var(--amber-2);border-color:rgba(245,165,36,.35);}

  /* ---------- marquee ---------- */
  .marquee{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(0,0,0,.15);overflow:hidden;white-space:nowrap;}
  .marquee .track{display:inline-flex;gap:44px;padding:16px 0;animation:slide 32s linear infinite;will-change:transform;}
  .marquee:hover .track{animation-play-state:paused;}
  @keyframes slide{to{transform:translateX(-50%);}}
  .marquee span{font-size:14px;color:var(--ink-3);display:inline-flex;align-items:center;gap:10px;font-weight:600;}
  .marquee span::before{content:"";width:6px;height:6px;background:var(--amber);border-radius:2px;transform:rotate(45deg);opacity:.7;}

  /* ---------- reveal / mask ---------- */
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1);}
  .reveal.in{opacity:1;transform:none;}
  .d1{transition-delay:.08s;} .d2{transition-delay:.16s;} .d3{transition-delay:.24s;} .d4{transition-delay:.32s;}
  .mask{overflow:hidden;display:block;}
  .mask>span{display:block;transform:translateY(105%);transition:transform .9s cubic-bezier(.19,1,.22,1);}
  .in .mask>span{transform:translateY(0);}

  /* ---------- stats band ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .stat{background:var(--paper-2);padding:28px 24px;transition:background .3s;}
  .stat:hover{background:var(--card);}
  .stat b{font-size:clamp(30px,4vw,46px);letter-spacing:-.03em;font-weight:800;color:var(--ink);display:block;line-height:1;}
  .stat b .u{color:var(--amber);font-size:.5em;}
  .stat span{color:var(--ink-3);font-size:13px;display:block;margin-top:10px;letter-spacing:.02em;}

  /* ---------- features bento ---------- */
  .bento{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;grid-template-areas:
    "a a b c"
    "a a d d"
    "
