<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BenchForge — 로컬 LLM 벤치마크 도구</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 26 L11 26 L16 8 L21 26 L30 26 L24 12 Z' fill='%23ff6a3d'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0c0a08;
  --ink-2:#100d0a;
  --ink-3:#16120d;
  --ink-4:#1e1811;
  --line:rgba(233,225,206,.10);
  --line-2:rgba(233,225,206,.18);
  --text:#ece6d7;
  --muted:#968d7a;
  --muted-2:#6e6656;
  --ember:#ff6a3d;
  --ember-deep:#e24a1e;
  --amber:#f6b23e;
  --sage:#8fc98a;
  --sky:#63b3d6;
  --plum:#c98bd6;
  --serif:"Iowan Old Style","Palatino Linotype","Palatino","Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","SFMono-Regular","Cascadia Code","Consolas","Menlo",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(120% 90% at 82% -10%, rgba(255,106,61,.12), transparent 55%),
    radial-gradient(110% 80% at 8% 12%, rgba(99,179,214,.08), transparent 55%),
    radial-gradient(120% 120% at 50% 120%, rgba(16,13,10,.9), transparent 60%),
    var(--ink);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(233,225,206,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(233,225,206,.035) 1px, transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(120% 100% at 50% 0%, #000 30%, transparent 85%);
}
::selection{background:var(--ember);color:#1a0d06}
a{color:inherit;text-decoration:none}

/* ---- type scale ---- */
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.02em;line-height:1.04}
h1{font-size:clamp(2.7rem,7.2vw,5.4rem)}
h2{font-size:clamp(2rem,4.6vw,3.5rem);line-height:1.05}
h3{font-size:clamp(1.2rem,2vw,1.55rem);line-height:1.2}
.mono{font-family:var(--mono)}
.eyebrow{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--ember);display:inline-flex;align-items:center;gap:.7em;margin-bottom:1.1rem;font-weight:600;
}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--ember);opacity:.7}
.lead{color:var(--muted);font-size:clamp(1rem,1.35vw,1.18rem);max-width:60ch}
strong{color:var(--text);font-weight:600}

/* ---- layout ---- */
.wrap{width:min(1240px,92vw);margin-inline:auto}
section{padding:clamp(4.5rem,9vw,8rem) 0;position:relative}
.sec-head{max-width:820px;margin-bottom:clamp(2.2rem,4vw,3.4rem)}
.sec-head h2{margin-bottom:1rem}

/* ---- buttons ---- */
.btn{
  display:inline-flex;align-items:center;gap:.55em;font-family:var(--mono);font-size:.82rem;
  letter-spacing:.04em;padding:.85em 1.35em;border-radius:2px;border:1px solid var(--line-2);
  background:transparent;color:var(--text);cursor:pointer;transition:.28s cubic-bezier(.2,.8,.2,1);
  position:relative;overflow:hidden;white-space:nowrap;
}
.btn .arr{transition:transform .3s}
.btn:hover .arr{transform:translate(3px,-3px)}
.btn--solid{background:var(--ember);color:#1a0d06;border-color:var(--ember);font-weight:600}
.btn--solid:hover{background:var(--amber);border-color:var(--amber);color:#1a0d06;box-shadow:0 12px 30px -12px rgba(255,106,61,.6)}
.btn--ghost:hover{background:var(--ink-3);border-color:var(--sage)}
.btn--sm{padding:.6em 1em;font-size:.74rem}

/* ---- reveal ---- */
[data-reveal]{opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
[data-reveal].in{opacity:1;transform:none}
.mask{overflow:hidden;display:block}
.mask>span{display:block;transform:translateY(115%);transition:transform .95s cubic-bezier(.16,.84,.24,1)}
.mask.in>span{transform:none}

/* ---- nav ---- */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1.1rem clamp(1rem,4vw,2.4rem);
  background:linear-gradient(var(--ink),rgba(12,10,8,.82));
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:.6rem;font-family:var(--serif);font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.brand svg{width:24px;height:24px}
.brand .dot{color:var(--ember)}
.nav-links{display:flex;gap:1.7rem;font-family:var(--mono);font-size:.8rem}
.nav-links a{color:var(--muted);transition:color .2s}
.nav-links a:hover{color:var(--text)}
.nav-right{display:flex;align-items:center;gap:1rem}
.status-pill{display:inline-flex;align-items:center;gap:.5em;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.status-pill .live{width:8px;height:8px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 0 rgba(143,201,138,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(143,201,138,.55)}70%{box-shadow:0 0 0 8px rgba(143,201,138,0)}100%{box-shadow:0 0 0 0 rgba(143,201,138,0)}}
@media(max-width:820px){.nav-links,.status-pill{display:none}}

/* ---- hero ---- */
.hero{padding-top:clamp(7rem,13vw,10rem);padding-bottom:clamp(3rem,6vw,5rem)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(2rem,4vw,3.5rem);align-items:center}
.hero h1{margin:.4rem 0 1.4rem}
.hero h1 .em{color:var(--ember);font-style:italic}
.hero .lead{margin-bottom:2rem}
.hero-cta{display:flex;flex-wrap:wrap;gap:.9rem;margin-bottom:2.4rem}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.hero-stats div{background:var(--ink-2);padding:1.1rem .9rem}
.hero-stats .n{font-family:var(--mono);font-size:1.7rem;color:var(--text);display:block;line-height:1}
.hero-stats .l{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);margin-top:.5rem;display:block}

/* ---- console ---- */
.console{
  background:linear-gradient(180deg,var(--ink-3),var(--ink-2));
  border:1px solid var(--line-2);border-radius:8px;overflow:hidden;
  box-shadow:0 40px 80px -40px rgba(0,0,0,.8),0 0 0 1px rgba(255,106,61,.05);
}
.console-bar{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:rgba(0,0,0,.25)}
.console-bar .w{width:11px;height:11px;border-radius:50%;background:var(--ink-4);border:1px solid var(--line-2)}
.console-bar .w:nth-child(1){background:#e24a1e}.console-bar .w:nth-child(2){background:var(--amber)}.console-bar .w:nth-child(3){background:var(--sage)}
.console-bar .title{margin-left:.6rem;font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.console-body{padding:1.3rem 1.2rem 1.5rem;font-family:var(--mono);font-size:.82rem}
.term-line{display:flex;gap:.5rem;margin-bottom:.55rem;min-height:1.2em}
.term-line .pr{color:var(--sage)}
.term-line .cm{color:var(--muted-2)}
.term-line .ok{color:var(--sage)}
.term-line .em{color:var(--ember)}
.term-line .am{color:var(--amber)}
.term-line .out{color:var(--text)}
.term-line .out.dim{color:var(--muted)}
.term-line .sk{color:var(--sky)}
.cursor{display:inline-block;width:8px;height:1.05em;background:var(--ember);vertical-align:-2px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.chart{margin-top:1.2rem;border-top:1px dashed var(--line-2);padding-top:1.1rem}
.chart .cap{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);margin-bottom:.7rem}
.bars{display:flex;align-items:flex-end;gap:.55rem;height:96px}
.bars .bar{flex:1;background:linear-gradient(180deg,var(--ember),rgba(255,106,61,.15));border-radius:2px 2px 0 0;height:0;transition:height 1.1s cubic-bezier(.2,.8,.2,1);position:relative}
.bars .bar::after{content:attr(data-v);position:absolute;top:-1.2em;left:0;right:0;text-align:center;font-size:.62rem;color:var(--muted)}
.chart.in .bars .bar{height:var(--h)}
.chart .axis{display:flex;justify-content:space-between;font-size:.62rem;color:var(--muted-2);margin-top:.5rem}

/* ---- marquee ---- */
.marquee{border-block:1px solid var(--line);padding:1.4rem 0;overflow:hidden;background:var(--ink-2)}
.marquee .lbl{font-family:var(--mono);font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted-2);text-align:center;margin-bottom:1rem}
.marquee-track{display:flex;gap:2.4rem;width:max-content;animation:scroll 34s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{font-family:var(--serif);font-size:1.35rem;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:2.4rem}
.marquee-track span::after{content:"·";color:var(--ember);font-size:.9rem}
.marquee-track b{color:var(--text);font-weight:600}
@keyframes scroll{to{transform:translateX(-50%)}}

/* ---- benchmarks ---- */
.bm-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:1.4rem}
.bm-card{grid-column:span 2;background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:1.4rem;position:relative;overflow:hidden;transition:.3s}
.bm-card:hover{border-color:var(--line-2);transform:translateY(-4px)}
.bm-card .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1rem}
.bm-card h3{font-size:1.15rem}
.bm-card .tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2)}
.bm-card .desc{color:var(--muted);font-size:.9rem;margin-bottom:1.3rem;min-height:3.4em}
.bm-card .metric{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.6rem}
.bm-card .metric .v{font-family:var(--mono);font-size:1.9rem;color:var(--text)}
.bm-card .metric .u{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.spark{height:44px;display:flex;align-items:flex-end;gap:3px}
.spark i{flex:1;background:var(--c,var(--ember));border-radius:1px;height:0;transition:height .9s cubic-bezier(.2,.8,.2,1);opacity:.85}
.bm-card.in .spark i{height:var(--h)}
.bm-card .foot{font-family:var(--mono);font-size:.68rem;color:var(--muted-2);margin-top:.9rem;display:flex;justify-content:space-between}
.bm-card .up{color:var(--sage)}
.bm-card .dn{color:var(--ember)}
.bm-card--wide{grid-column:span 3}
.bm-card--full{grid-column:span 6}
.bm-card--full .inner{display:grid;grid-template-columns:1.1fr 1fr;gap:2rem;align-items:center}
.bm-card--full table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.8rem}
.bm-card--full td,.bm-card--full th{text-align:left;padding:.6rem .5rem;border-bottom:1px solid var(--line)}
.bm-card--full th{color:var(--muted-2);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.bm-card
