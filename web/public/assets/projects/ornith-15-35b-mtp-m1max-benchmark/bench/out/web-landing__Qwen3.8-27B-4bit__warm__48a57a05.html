<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOCALE — 로컬 LLM 벤치마크</title>
<style>
  :root{
    --ink:#0a0d10;
    --ink-2:#0e1319;
    --panel:#121821;
    --panel-2:#161e29;
    --line:rgba(233,238,245,.09);
    --line-2:rgba(233,238,245,.16);
    --text:#e9eef5;
    --muted:#8b96a5;
    --faint:#5a6572;
    --amber:#ffb454;
    --amber-d:#e08a2b;
    --mint:#5fe3b0;
    --coral:#ff6f61;
    --sky:#63c7ff;
    --violet:#b98cff;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--amber);color:#1a1206}
  a{color:inherit;text-decoration:none}
  img,svg{display:block}
  .wrap{max-width:1200px;margin:0 auto;padding:0 28px}

  /* ---------- ambient background ---------- */
  .bg{position:fixed;inset:0;z-index:-2
