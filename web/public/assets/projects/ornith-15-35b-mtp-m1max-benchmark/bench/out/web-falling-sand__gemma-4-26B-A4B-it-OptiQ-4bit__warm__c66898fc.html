<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Cellular Automata Sandbox</title>
    <style>
        body {
            background: #222;
            color: #eee;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            overflow: hidden;
        }
        canvas {
            background: #000;
            border: 2px solid #555;
            cursor: crosshair;
            image-rendering: pixelated;
            width: 600px;
            height: 600px;
        }
        .controls {
            padding: 10px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            background: #333;
            width: 100%;
        }
        .stat { font-size: 12px; color: #aaa; }
        .btn-group { display: flex; gap: 5px; }
        button { cursor: pointer; padding: 5px 10px; }
        .active { background: #ffeb3b; font-weight: bold; }
    </style>
</head>
<body>

<div class="controls">
    <div class="btn-group">
        <button onclick="setMaterial(1)" id="btn1">Sand</button>
        <button onclick="setMaterial(2)" id="btn2">Water</button>
        <button onclick="setMaterial(3)" id="btn3">Wall</button>
        <button onclick="setMaterial(4)" id="btn4">Acid</button>
    </div>
    <div class="btn-group">
        <input type="range" id="brushSize" min="1" max="10" value="3">
        <label>Brush</label>
    </div>
    <div class="btn-group">
        <button onclick="togglePause()" id="pauseBtn">Pause</button>
        <button onclick="resetGrid()">Reset</button>
    </div>
    <div class="stat">
        FPS: <span id="fps">0</span> | Particles: <span id="count">0</span>
    </div>
</div>

<canvas id="canvas" width="200" height="200"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const width = 200;
    const height = 200;
    
    // Materials: 0: Empty, 1: Sand, 2: Water, 3: Wall, 4: Acid
    let grid = new Uint8Array(width * height);
    let nextGrid = new Uint8Array(width * height);
    
    let currentMaterial = 1;
    let isPaused = false;
    let brushSize = 3;
    let isMouseDown = false;

    const colors = {
        0: [0, 0, 0],       // Empty
        1: [230, 190, 100], // Sand
        2: [50, 120, 255],  // Water
        3: [120, 120, 120], // Wall
        4: [150, 255, 50]   // Acid
    };

    function setMaterial(m) {
        currentMaterial = m;
        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn' + m);
        if(btn) btn.classList.add('active');
    }
    setMaterial(1);

    function resetGrid() {
        grid.fill(0);
        nextGrid.fill(0);
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pauseBtn').innerText = isPaused ? "Resume" : "Pause";
    }

    canvas.onmousedown = () => isMouseDown = true;
    window.onmouseup = () => isMouseDown = false;
    canvas.onmousemove = (e) => {
        if (!isMouseDown) return;
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) * (width / rect.width));
        const y = Math.floor((e.clientY - rect.top) * (height / rect.height));
        brushSize = parseInt(document.getElementById('brushSize').value);
        
        for(let i = -brushSize; i <= brushSize; i++) {
            for(let j = -brushSize; j <= brushSize; j++) {
                if(x+i >= 0 && x+i < width && y+j >= 0 && y+j < height) {
                    if(currentMaterial === 3 || grid[(y+j)*width + (x+i)] === 0) {
                        grid[(y+j)*width + (x+i)] = currentMaterial;
                    }
                }
            }
        }
    };

    let lastTime = 0;
    let frameCount = 0;
    let fps = 0;

    function update() {
        if (isPaused) return;

        nextGrid.set(grid);
        let particleCount = 0;

        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                const idx = y * width + x;
                const type = grid[idx];
                if (type === 0) continue;
                particleCount++;

                if (type === 1) { // Sand
                    if (y < height - 1) {
                        if (grid[(y + 1) * width + x] === 0) {
                            nextGrid[idx] = 0;
                            nextGrid[(y + 1) * width + x] = 1;
                        } else if (x > 0 && grid[(y + 1) * width + (x - 1)] === 0) {
                            nextGrid[idx] = 0;
                            nextGrid[(y + 1) * width + (x - 1)] = 1;
                        } else if (x < width - 1 && grid[(y + 1) * width + (x + 1)] === 0) {
                            nextGrid[idx] = 0;
                            nextGrid[(y + 1) * width + (x + 1)] = 1;
                        }
                    }
                } else if (type === 2) { // Water
                    if (y < height - 1) {
                        if (grid[(y + 1) * width + x] === 0) {
                            nextGrid[idx] = 0;
                            nextGrid[(y + 1) * width + x] = 2;
                        } else {
                            const dir = Math.random() < 0.5 ? -1 : 1;
                            if (x + dir >= 0 && x + dir < width && grid[y * width + (x + dir)] === 0) {
                                nextGrid[idx] = 0;
                                nextGrid[y * width + (x + dir)] = 2;
                            }
                        }
                    }
                } else if (type === 4) { // Acid
                    // Acid dissolves Sand(1) and Water(2)
                    const neighbors = [[0,1],[0,-1],[1,0],[-1,0]];
                    let dissolved = false;
                    for(let [dx, dy] of neighbors) {
                        let nx = x + dx, ny = y + dy;
                        if(nx >= 0 && nx < width && ny >= 0 && ny < height) {
                            let target = grid[ny * width + nx];
                            if(target === 1 || target === 2) {
                                nextGrid[ny * width + nx] = 0;
                                nextGrid[idx] = 0;
                                dissolved = true;
                                break;
                            }
                        }
                    }
                    if(!dissolved && y < height - 1 && grid[(y+1)*width+x] === 0) {
                        nextGrid[idx] = 0;
                        nextGrid[(y+1)*width+x] = 4;
                    }
                }
            }
        }
        grid.set(nextGrid);
        document.getElementById('count').innerText = particleCount;
    }

    function draw() {
        const imgData = ctx.createImageData(width, height);
        for (let i = 0; i < grid.length; i++) {
            const color = colors[grid[i]];
            const p = i * 4;
            imgData.data[p] = color[0];
            imgData.data[p+1] = color[1];
            imgData.data[p+2] = color[2];
            imgData.data[p+3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);
    }

    function loop(time) {
        if (time - lastTime >= 1000) {
            fps = frameCount;
            frameCount = 0;
            lastTime = time;
            document.getElementById('fps').innerText = fps;
        }
        frameCount++;

        update();
        draw();
        requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
</script>
</body>
</html>
