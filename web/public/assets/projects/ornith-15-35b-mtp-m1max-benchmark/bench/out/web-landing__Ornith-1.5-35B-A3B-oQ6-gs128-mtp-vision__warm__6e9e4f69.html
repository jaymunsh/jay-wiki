<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalBench — 로컬 LLM 벤치마크 도구</title>
<style>
  :root {
    --bg: #0a0e17;
    --bg-alt: #111827;
    --card: #161f2e;
    --border: #243044;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #4f9cff;
    --accent2: #7c5cff;
    --green: #34d399;
    --gradient: linear-gradient(135deg, #4f9cff 0%, #7c5cff 100%);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* Header */
  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    background: rgba(10, 14, 23, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 20px;
    text-decoration: none;
    color: var(--text);
  }

  .logo-icon {
    width: 32px;
    height: 32px;
    background: var(--gradient);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 32px;
    list-style: none;
  }

  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 15px;
    transition: color 0.2s;
  }

  .nav-links a:hover {
    color: var(--text);
  }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--gradient);
    color: white;
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(79, 156, 255, 0.3);
  }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Hero */
  .hero {
    padding: 160px 0 100px;
    text-align: center;
    position: relative;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(79, 156, 255, 0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
  }

  .badge-dot {
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
  }

  .hero h1 {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 24px;
    letter-spacing: -1px;
  }

  .hero h1 .gradient-text {
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero p {
    font-size: 20px;
    color: var(--muted);
    max-width: 640px;
    margin: 0 auto 40px;
  }

  .hero-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .code-preview {
    max-width: 720px;
    margin: 64px auto 0;
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    text-align: left;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
  }

  .code-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 18px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }

  .code-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .code-dot.red { background: #ff5f56; }
  .code-dot.yellow { background: #ffbd2e; }
  .code-dot.green { background: #27c93f; }

  .code-title {
    margin-left: 8px;
    color: var(--muted);
    font-size: 13px;
    font-family: monospace;
  }

  .code-body {
    padding: 20px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.8;
    overflow-x: auto;
  }

  .code-body .comment { color: #6a737d; }
  .code-body .cmd { color: var(--accent); }
  .code-body .string { color: var(--green); }
  .code-body .flag { color: var(--accent2); }

  /* Stats */
  .stats {
    padding: 60px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
  }

  .stat-item {
    text-align: center;
  }

  .stat-number {
    font-size: 42px;
    font-weight: 800;
    background: var(--gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-label {
    color: var(--muted);
    font-size: 15px;
    margin-top: 4px;
  }

  /* Section */
  section {
    padding: 100px 0;
  }

  .section-header {
    text-align: center;
    max-width: 640px;
    margin: 0 auto 64px;
  }

  .section-header .overline {
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
  }

  .section-header h2 {
    font-size: 40px;
    font-weight: 800;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
  }

  .section-header p {
    color: var(--muted);
    font-size: 18px;
  }

  /* Features */
  .features-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .feature-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    transition: all 0.3s;
  }

  .feature-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 16px 32px rgba(0, 0, 0, 0.3);
  }

  .feature-icon {
    width: 48px;
    height: 48px;
    background: var(--gradient);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    margin-bottom: 20px;
  }

  .feature-card h3 {
    font-size: 20px;
    margin-bottom: 12px;
  }

  .feature-card p {
    color: var(--muted);
    font-size: 15px;
  }

  /* Benchmarks */
  .benchmarks {
    background: var(--bg-alt);
  }

  .benchmark-list {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .benchmark-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
  }

  .benchmark-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .benchmark-name {
    font-weight: 600;
    font-size: 16px;
  }

  .benchmark-score {
    font-weight: 700;
    color: var(--accent);
  }

  .benchmark-bar {
    height: 8px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
  }

  .benchmark-fill {
    height: 100%;
    background: var(--gradient);
    border-radius: 4px;
    transition: width 1s ease;
  }

  /* Workflow */
  .workflow-steps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }

  .step {
    position: relative;
  }

  .step-number {
    width: 40px;
    height: 40px;
    background: var(--gradient);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .step h3 {
    font-size: 18px;
    margin-bottom: 8px;
  }

  .step p {
    color: var(--muted);
    font-size: 14px;
  }

  /* Pricing */
  .pricing-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
    align-items: start;
  }

  .pricing-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    position: relative;
  }

  .pricing-card.featured {
    border-color: var(--accent);
    transform: scale(1.05);
  }

  .pricing-badge {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gradient);
    padding: 4px 16px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
  }

  .pricing-card h3 {
    font-size: 20px;
    margin-bottom: 8px;
  }

  .pricing-price {
    font-size: 40px;
    font-weight: 800;
    margin: 16px 0;
  }

  .pricing-price span {
    font-size: 16px;
    color: var(--muted);
    font-weight: 400;
  }

  .pricing-features {
    list-style: none;
    margin: 24px 0;
  }

  .pricing-features li {
    padding: 8px 0;
    color: var(--muted);
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pricing-features li::before {
    content: '✓';
    color: var(--green);
    font-weight: 700;
  }

  /* CTA */
  .cta {
    text-align: center;
    background: var(--bg-alt);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }

  .cta h2 {
    font-size: 40px;
    margin-bottom: 16px;
  }

  .cta p {
    color: var(--muted);
    font-size: 18px;
    margin-bottom: 32px;
  }

  /* Footer */
  footer {
    padding: 60px 0 40px;
  }

  .footer-grid {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 40px;
    margin-bottom: 40px;
  }

  .footer-brand p {
    color: var(--muted);
    margin-top: 16px;
    font-size: 14px;
    max-width: 280px;
  }

  .footer-col h4 {
    font-size: 15px;
    margin-bottom: 16px;
  }

  .footer-col ul {
    list-style: none;
  }

  .footer-col li {
    margin-bottom: 10px;
  }

  .footer-col a {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    transition: color 0.2s;
  }

  .footer-col a:hover {
    color: var(--accent);
  }

  .footer-bottom {
    border-top: 1px solid var(--border);
    padding-top: 24px;
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 14px;
  }

  /* Responsive */
  @media (max-width: 968px) {
    .hero h1 { font-size: 40px; }
    .features-grid, .pricing-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2,
